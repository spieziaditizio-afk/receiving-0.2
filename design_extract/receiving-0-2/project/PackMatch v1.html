<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PackMatch — Arrow Electronics | Microsoft WH</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #0d0f14; color: #e3e5ef; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
    input, button, select { font-family: inherit; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #141720; }
    ::-webkit-scrollbar-thumb { background: #2c3047; border-radius: 3px; }
    @keyframes pulse-dot { 0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(35,197,94,0.4); } 50% { opacity:.7; box-shadow: 0 0 0 6px rgba(35,197,94,0); } }
    @keyframes flash-green { 0% { background: rgba(35,197,94,0.22); } 100% { background: transparent; } }
    @keyframes flash-red { 0% { background: rgba(239,68,68,0.22); } 100% { background: transparent; } }
    @keyframes flash-yellow { 0% { background: rgba(245,158,11,0.22); } 100% { background: transparent; } }
    @keyframes slide-in { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform: none; } }
    @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    @media print {
      body * { visibility: hidden !important; }
      .label-print-area, .label-print-area * { visibility: visible !important; }
      .label-print-area { position: fixed !important; top:0; left:0; width:12.8cm; height:6.3cm; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── palette ─────────────────────────────────────── */
const C = {
  bg:       '#0d0f14', surface:  '#141720', s2: '#1b1f2c', s3: '#232839',
  border:   '#2c3047', borderL:  '#3a4060',
  text:     '#e3e5ef', sec:      '#8890a8', muted:    '#565e7a',
  orange:   '#f47c1f', orangeL:  '#ff9940',
  green:    '#23c55e', greenDim: '#14532d',
  red:      '#ef4444', redDim:   '#7f1d1d',
  yellow:   '#f59e0b', yellowDim:'#78350f',
  blue:     '#3b82f6',
};

/* ── small icons ─────────────────────────────────── */
const Ic = ({ d, size=16, color='currentColor', fill='none', sw=2 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color}
    strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    <path d={d} />
  </svg>
);
const Icons = {
  scan:    "M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10",
  check:   "M20 6 9 17l-5-5",
  xmark:   "M18 6 6 18M6 6l12 12",
  plus:    "M12 5v14M5 12h14",
  trash:   "M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6",
  print:   "M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z",
  warn:    "M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01",
  reset:   "M1 4v6h6M3.51 15a9 9 0 1 0 .49-4.34",
  arrow:   "M5 12h14M12 5l7 7-7 7",
  box:     "M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16zM3.27 6.96 12 12.01l8.73-5.05M12 22.08V12",
};
const Svg = ({ name, size=16, color='currentColor' }) => <Ic d={Icons[name]} size={size} color={color} />;

/* ── status badge ─────────────────────────────────── */
const STATUSES = {
  pending:  { label:'PENDING',   bg:C.s3,        fg:C.muted,  border:C.border  },
  partial:  { label:'PARTIAL',   bg:'#1e3557',   fg:C.blue,   border:C.blue    },
  matched:  { label:'MATCHED',   bg:C.greenDim,  fg:C.green,  border:C.green   },
  over:     { label:'OVER QTY',  bg:C.yellowDim, fg:C.yellow, border:C.yellow  },
  missing:  { label:'MISSING',   bg:C.redDim,    fg:C.red,    border:C.red     },
  notfound: { label:'NOT FOUND', bg:C.redDim,    fg:'#fca5a5',border:C.red     },
};
const Badge = ({ status }) => {
  const s = STATUSES[status] || STATUSES.pending;
  return (
    <span style={{
      display:'inline-block', padding:'2px 7px', borderRadius:4,
      fontSize:10, fontWeight:700, letterSpacing:'0.07em',
      fontFamily:"'JetBrains Mono', monospace",
      background:s.bg, color:s.fg, border:`1px solid ${s.border}`,
    }}>{s.label}</span>
  );
};

/* ── helpers ──────────────────────────────────────── */
const getStatus = (item) => {
  if (item.scanned === 0) return 'pending';
  if (item.scanned < item.qty) return 'partial';
  if (item.scanned === item.qty) return 'matched';
  return 'over';
};
const now = () => new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
const dateStr = () => new Date().toLocaleString('en-GB', { dateStyle:'medium', timeStyle:'short' });

/* ═══════════════════════════════════════════════════
   SCREEN 1 — SETUP
═══════════════════════════════════════════════════ */
const inputSx = {
  width:'100%', padding:'9px 12px', borderRadius:7,
  background:C.s2, border:`1px solid ${C.border}`, color:C.text,
  fontSize:14, fontFamily:"'JetBrains Mono', monospace", outline:'none',
  transition:'border-color .15s',
};
const labelSx = { display:'block', fontSize:10, fontWeight:700, color:C.muted, letterSpacing:'0.07em', marginBottom:5 };

const SetupScreen = ({ onStart }) => {
  const [po, setPo]   = useState('');
  const [del, setDel] = useState('');
  const [items, setItems] = useState([]);
  const [pn, setPn]   = useState('');
  const [qty, setQty] = useState('');
  const [coo, setCoo] = useState('');
  const [err, setErr] = useState('');
  const pnRef = useRef();

  const add = () => {
    const cleanPn = pn.trim().toUpperCase();
    if (!cleanPn || !qty || +qty < 1) { setErr('Part Number and Quantity are required.'); return; }
    if (items.find(i => i.pn === cleanPn)) { setErr(`${cleanPn} is already in the list.`); return; }
    setItems(p => [...p, { id: Date.now(), pn: cleanPn, qty: +qty, coo: coo.trim().toUpperCase() || '—', scanned:0 }]);
    setPn(''); setQty(''); setCoo(''); setErr('');
    pnRef.current?.focus();
  };

  const canStart = po.trim() && del.trim() && items.length > 0;
  const total = items.reduce((s,i) => s+i.qty, 0);

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'32px 0' }}>
      <div style={{ maxWidth:820, margin:'0 auto', padding:'0 28px' }}>

        {/* title */}
        <div style={{ marginBottom:28 }}>
          <h1 style={{ fontSize:22, fontWeight:800, color:C.text, letterSpacing:'-0.02em' }}>New Reconciliation Session</h1>
          <p style={{ color:C.sec, fontSize:13, marginTop:4 }}>
            Enter the packing list, then start scanning boxes against it in real time.
          </p>
        </div>

        {/* session details */}
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:22, marginBottom:16 }}>
          <div style={{ fontSize:10, fontWeight:700, color:C.muted, letterSpacing:'0.08em', marginBottom:16 }}>SESSION DETAILS</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
            {[
              { label:'PO NUMBER', val:po, set:setPo, ph:'e.g. 4500123456' },
              { label:'DELIVERY NUMBER', val:del, set:setDel, ph:'e.g. 8100987654' },
            ].map(f => (
              <div key={f.label}>
                <label style={labelSx}>{f.label} *</label>
                <input value={f.val} onChange={e=>f.set(e.target.value)} placeholder={f.ph} style={inputSx} />
              </div>
            ))}
          </div>
        </div>

        {/* add items */}
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:22, marginBottom:16 }}>
          <div style={{ fontSize:10, fontWeight:700, color:C.muted, letterSpacing:'0.08em', marginBottom:16 }}>PACKING LIST ITEMS</div>

          <div style={{ display:'grid', gridTemplateColumns:'2fr 100px 120px auto', gap:10, marginBottom:8, alignItems:'end' }}>
            <div>
              <label style={labelSx}>PART NUMBER *</label>
              <input ref={pnRef} value={pn} onChange={e=>setPn(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&add()} placeholder="e.g. 0C19551" style={inputSx} />
            </div>
            <div>
              <label style={labelSx}>QTY *</label>
              <input value={qty} onChange={e=>setQty(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&add()} type="number" min="1" placeholder="0" style={inputSx} />
            </div>
            <div>
              <label style={labelSx}>COUNTRY OF ORIGIN</label>
              <input value={coo} onChange={e=>setCoo(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&add()} placeholder="CN / US / MX" style={inputSx} />
            </div>
            <button onClick={add} style={{
              height:38, padding:'0 16px', borderRadius:7, border:'none',
              background:C.orange, color:'#fff', cursor:'pointer', fontSize:13, fontWeight:700,
              display:'flex', alignItems:'center', gap:5,
            }}>
              <Svg name="plus" size={14} color="#fff" /> Add
            </button>
          </div>
          {err && <div style={{ color:C.red, fontSize:12, marginBottom:8 }}>{err}</div>}

          {items.length === 0 ? (
            <div style={{
              padding:'28px 0', textAlign:'center', border:`1px dashed ${C.border}`,
              borderRadius:8, color:C.muted, fontSize:13,
            }}>No items yet — fill in the fields above and press Add</div>
          ) : (
            <div style={{ border:`1px solid ${C.border}`, borderRadius:8, overflow:'hidden' }}>
              <table style={{ width:'100%', borderCollapse:'collapse' }}>
                <thead>
                  <tr style={{ background:C.s3 }}>
                    {['#','PART NUMBER','QTY','COO',''].map((h,i) => (
                      <th key={i} style={{
                        padding:'7px 12px', textAlign:i===2?'center':'left',
                        fontSize:9, fontWeight:700, color:C.muted, letterSpacing:'0.08em',
                        borderBottom:`1px solid ${C.border}`,
                      }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {items.map((item,i) => (
                    <tr key={item.id} style={{ borderBottom:`1px solid ${C.border}` }}>
                      <td style={{ padding:'9px 12px', fontSize:11, color:C.muted }}>{i+1}</td>
                      <td style={{ padding:'9px 12px', fontFamily:"'JetBrains Mono',monospace", fontSize:13, fontWeight:700, color:C.orange }}>{item.pn}</td>
                      <td style={{ padding:'9px 12px', textAlign:'center', fontFamily:"'JetBrains Mono',monospace", fontSize:14, fontWeight:800, color:C.text }}>{item.qty}</td>
                      <td style={{ padding:'9px 12px', fontSize:12, color:C.sec }}>{item.coo}</td>
                      <td style={{ padding:'9px 10px', textAlign:'right' }}>
                        <button onClick={()=>setItems(p=>p.filter(x=>x.id!==item.id))} style={{
                          background:'none', border:'none', cursor:'pointer', color:C.muted, padding:4,
                          borderRadius:4, display:'inline-flex', alignItems:'center',
                        }}>
                          <Svg name="trash" size={13} color={C.muted} />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
                <tfoot>
                  <tr style={{ background:C.s3 }}>
                    <td colSpan={2} style={{ padding:'8px 12px', fontSize:11, color:C.sec }}>{items.length} line items</td>
                    <td style={{ padding:'8px 12px', textAlign:'center', fontFamily:"'JetBrains Mono',monospace", fontSize:13, fontWeight:800, color:C.text }}>{total}</td>
                    <td colSpan={2} style={{ padding:'8px 12px', fontSize:11, color:C.sec }}>total units expected</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          )}
        </div>

        <div style={{ display:'flex', justifyContent:'flex-end' }}>
          <button
            onClick={() => canStart && onStart({ po, del, items })}
            disabled={!canStart}
            style={{
              display:'flex', alignItems:'center', gap:8,
              padding:'11px 26px', borderRadius:8, border:'none',
              background: canStart ? C.orange : C.s3,
              color: canStart ? '#fff' : C.muted,
              cursor: canStart ? 'pointer' : 'not-allowed',
              fontSize:14, fontWeight:700, letterSpacing:'0.01em',
              transition:'background .15s',
            }}
          >
            Start Reconciliation <Svg name="arrow" size={15} color={canStart?'#fff':C.muted} />
          </button>
        </div>
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════════════
   SCREEN 2 — SCAN / RECONCILIATION
═══════════════════════════════════════════════════ */
const ScanScreen = ({ session, onComplete }) => {
  const [items, setItems] = useState(session.items.map(i=>({...i,scanned:0})));
  const [input, setInput] = useState('');
  const [lastScan, setLastScan] = useState(null);   // {pn, scanStatus, time}
  const [log, setLog]     = useState([]);
  const [toasts, setToasts] = useState([]);
  const [scanCount, setScanCount] = useState(0);
  const [flashKey, setFlashKey] = useState(0);
  const [flashType, setFlashType] = useState(null); // 'green'|'red'|'yellow'
  const [shaking, setShaking] = useState(false);
  const inputRef = useRef();
  const logRef   = useRef();

  // always keep scanner input focused
  useEffect(() => { inputRef.current?.focus(); }, []);
  const refocus = () => setTimeout(() => inputRef.current?.focus(), 50);

  const addToast = (msg, type) => {
    const id = Date.now() + Math.random();
    setToasts(p => [{ id, msg, type }, ...p].slice(0,3));
    setTimeout(() => setToasts(p => p.filter(t=>t.id!==id)), 7000);
  };

  const processScan = (raw) => {
    const pn = raw.trim().toUpperCase();
    if (!pn) return;
    const t = now();
    let scanStatus = 'notfound';
    let updatedItems = items;

    updatedItems = items.map(item => {
      if (item.pn !== pn) return item;
      const ns = item.scanned + 1;
      if (ns > item.qty) scanStatus = 'over';
      else if (ns === item.qty) scanStatus = 'matched';
      else scanStatus = 'partial';
      return { ...item, scanned: ns };
    });

    const found = updatedItems.some(i=>i.pn===pn);
    const triggerFlash = (type) => {
      setFlashType(type);
      setFlashKey(k=>k+1);
      setTimeout(() => setFlashType(null), 700);
    };

    if (!found) {
      scanStatus = 'notfound';
      addToast(`NOT IN LIST — "${pn}" is not on this packing list`, 'error');
      setShaking(true); setTimeout(()=>setShaking(false), 400);
      triggerFlash('red');
    } else if (scanStatus === 'over') {
      addToast(`OVER QUANTITY — ${pn} exceeds expected quantity`, 'warn');
      triggerFlash('yellow');
    } else {
      triggerFlash('green');
    }

    setItems(updatedItems);
    setLastScan({ pn, scanStatus, time: t });
    setLog(p => [{ id:Date.now(), pn, scanStatus, time:t }, ...p].slice(0,100));
    setScanCount(c=>c+1);
    setInput('');
    refocus();
  };

  const handleKey = (e) => { if (e.key === 'Enter') processScan(input); };

  const matched  = items.filter(i=>i.scanned>=i.qty).length;
  const total    = items.length;
  const progress = total ? (matched/total)*100 : 0;
  const allDone  = matched === total;
  const discrepancyCount = items.filter(i=>i.scanned>i.qty).length
    + log.filter(l=>l.scanStatus==='notfound').length;

  const flashColors = { green:'rgba(35,197,94,0.15)', red:'rgba(239,68,68,0.15)', yellow:'rgba(245,158,11,0.15)' };

  return (
    <div style={{ flex:1, display:'flex', overflow:'hidden' }}>

      {/* ── LEFT: packing list ────────── */}
      <div style={{
        width:300, flexShrink:0, background:C.surface, borderRight:`1px solid ${C.border}`,
        display:'flex', flexDirection:'column', overflow:'hidden',
      }}>
        <div style={{ padding:'13px 16px', borderBottom:`1px solid ${C.border}`, flexShrink:0 }}>
          <div style={{ fontSize:9, fontWeight:700, color:C.muted, letterSpacing:'0.08em', marginBottom:2 }}>PACKING LIST</div>
          <div style={{ fontSize:12, color:C.sec }}>{matched}/{total} lines complete</div>
          <div style={{ height:3, background:C.s3, borderRadius:2, marginTop:8 }}>
            <div style={{
              height:'100%', borderRadius:2, transition:'width .4s ease',
              width:`${progress}%`, background: progress===100 ? C.green : C.orange,
            }} />
          </div>
        </div>
        <div style={{ flex:1, overflowY:'auto', padding:10, display:'flex', flexDirection:'column', gap:6 }}>
          {items.map(item => {
            const st   = getStatus(item);
            const isLast = lastScan && lastScan.pn === item.pn;
            const stC  = { matched:C.green, over:C.yellow, partial:C.blue, pending:C.border }[st] || C.border;
            return (
              <div key={item.id} style={{
                background: isLast ? C.s3 : C.s2,
                border:`1px solid ${isLast ? C.orange : stC}`,
                borderRadius:8, padding:'10px 12px',
                transition:'all .2s ease',
              }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:5 }}>
                  <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:13, fontWeight:800, color:C.orange }}>{item.pn}</span>
                  <Badge status={st} />
                </div>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:5 }}>
                  <span style={{ fontSize:10, color:C.muted }}>COO: {item.coo}</span>
                  <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:16, fontWeight:800 }}>
                    <span style={{ color: st==='matched'?C.green : st==='over'?C.yellow : st==='partial'?C.blue : C.text }}>{item.scanned}</span>
                    <span style={{ color:C.muted }}>/{item.qty}</span>
                  </span>
                </div>
                <div style={{ height:2, background:C.s3, borderRadius:1 }}>
                  <div style={{
                    height:'100%', borderRadius:1, transition:'width .3s ease',
                    width:`${Math.min(100,(item.scanned/item.qty)*100)}%`,
                    background: st==='over'?C.yellow : st==='matched'?C.green : C.blue,
                  }} />
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ── CENTER: scanner area ────────── */}
      <div style={{
        flex:1, display:'flex', flexDirection:'column', overflow:'hidden', position:'relative',
        background: flashType
          ? `radial-gradient(ellipse at center, ${flashColors[flashType]} 0%, transparent 70%)`
          : 'transparent',
        animation: flashType ? `flash-${flashType} 0.6s ease forwards` : 'none',
        animationPlayState: 'running',
      }} key={`flash-${flashKey}`}>

        {/* toasts */}
        <div style={{ padding:'10px 16px 0', display:'flex', flexDirection:'column', gap:7, flexShrink:0 }}>
          {toasts.map(t => (
            <div key={t.id} style={{
              display:'flex', alignItems:'center', gap:10, padding:'10px 14px', borderRadius:8,
              background: t.type==='error' ? '#3b0f0f' : '#3b2a0a',
              border:`1px solid ${t.type==='error' ? C.red : C.yellow}`,
              color: t.type==='error' ? '#fca5a5' : '#fde68a',
              fontSize:13, fontWeight:600, animation:'slide-in .2s ease',
            }}>
              <Svg name="warn" size={15} color={t.type==='error'?C.red:C.yellow} />
              {t.msg}
            </div>
          ))}
        </div>

        {/* main scan center */}
        <div style={{
          flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
          padding:32,
        }}>

          {/* last scan result bubble */}
          {lastScan ? (
            <div style={{
              width:'100%', maxWidth:460, marginBottom:28, padding:'20px 24px',
              borderRadius:12, textAlign:'center',
              background: {
                matched:'rgba(35,197,94,0.07)',
                over:'rgba(245,158,11,0.07)',
                partial:'rgba(59,130,246,0.07)',
                notfound:'rgba(239,68,68,0.07)',
              }[lastScan.scanStatus] || C.surface,
              border:`2px solid ${{
                matched:C.green, over:C.yellow, partial:C.blue, notfound:C.red,
              }[lastScan.scanStatus] || C.border}`,
              animation:'slide-in .2s ease',
            }}>
              <div style={{ fontSize:10, color:C.muted, letterSpacing:'0.07em', marginBottom:6 }}>LAST SCANNED</div>
              <div style={{
                fontFamily:"'JetBrains Mono',monospace", fontSize:30, fontWeight:900,
                color:C.text, marginBottom:10, wordBreak:'break-all',
                animation: shaking ? 'shake .3s ease' : 'none',
              }}>{lastScan.pn}</div>
              <Badge status={lastScan.scanStatus} />
              <div style={{ fontSize:10, color:C.muted, marginTop:8 }}>{lastScan.time}</div>
            </div>
          ) : (
            <div style={{ marginBottom:28, textAlign:'center', color:C.muted }}>
              <Svg name="box" size={40} color={C.border} />
              <div style={{ marginTop:12, fontSize:14 }}>Ready to scan</div>
            </div>
          )}

          {/* scan input */}
          <div style={{ width:'100%', maxWidth:460 }}>
            <div style={{
              fontSize:10, fontWeight:700, color:C.muted, letterSpacing:'0.07em', marginBottom:8,
              display:'flex', alignItems:'center', gap:6,
            }}>
              <span style={{
                display:'inline-block', width:7, height:7, borderRadius:'50%', background:C.green,
                animation:'pulse-dot 2s infinite',
              }} />
              SCANNER INPUT — DS3678 READY
            </div>
            <div style={{ position:'relative' }}>
              <input
                ref={inputRef}
                value={input}
                onChange={e=>setInput(e.target.value)}
                onKeyDown={handleKey}
                placeholder="Scan barcode or type Part Number + Enter…"
                autoFocus
                style={{
                  ...inputSx, fontSize:17, fontWeight:700,
                  padding:'13px 48px 13px 16px', height:54,
                  border:`2px solid ${C.orange}`, borderRadius:10,
                  width:'100%',
                }}
              />
              <div style={{ position:'absolute', right:14, top:'50%', transform:'translateY(-50%)' }}>
                <Svg name="scan" size={20} color={C.orange} />
              </div>
            </div>
            <div style={{ fontSize:11, color:C.muted, marginTop:6, textAlign:'center' }}>
              Press Enter to submit · {scanCount} scan{scanCount!==1?'s':''} this session
            </div>
          </div>

          {/* stats row */}
          <div style={{ display:'flex', gap:12, marginTop:28, flexWrap:'wrap', justifyContent:'center' }}>
            {[
              { label:'EXPECTED',     val: items.reduce((s,i)=>s+i.qty,0),    color:C.sec   },
              { label:'SCANNED',      val: items.reduce((s,i)=>s+i.scanned,0),color:C.text  },
              { label:'LINES DONE',   val: `${matched}/${total}`,              color:C.green },
              { label:'DISCREPANCIES',val: discrepancyCount,                   color: discrepancyCount>0?C.red:C.muted },
            ].map(s => (
              <div key={s.label} style={{
                background:C.surface, border:`1px solid ${C.border}`, borderRadius:8,
                padding:'12px 18px', textAlign:'center', minWidth:90,
              }}>
                <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:22, fontWeight:900, color:s.color }}>{s.val}</div>
                <div style={{ fontSize:9, color:C.muted, letterSpacing:'0.07em', marginTop:2 }}>{s.label}</div>
              </div>
            ))}
          </div>

          {/* complete CTA */}
          <div style={{ marginTop:24, display:'flex', gap:10 }}>
            {allDone && (
              <button onClick={()=>onComplete({items,log,scanCount})} style={{
                padding:'11px 24px', borderRadius:8, border:'none',
                background:C.green, color:'#fff', fontSize:14, fontWeight:700, cursor:'pointer',
              }}>
                ✓ All clear — Complete session
              </button>
            )}
            {!allDone && scanCount > 0 && (
              <button onClick={()=>onComplete({items,log,scanCount})} style={{
                padding:'9px 18px', borderRadius:8, border:`1px solid ${C.border}`,
                background:'transparent', color:C.sec, fontSize:13, cursor:'pointer',
              }}>
                End session (with open items)
              </button>
            )}
          </div>
        </div>

        {/* scan log */}
        {log.length > 0 && (
          <div ref={logRef} style={{
            height:150, borderTop:`1px solid ${C.border}`, background:C.surface,
            padding:'10px 16px', overflowY:'auto', flexShrink:0,
          }}>
            <div style={{ fontSize:9, fontWeight:700, color:C.muted, letterSpacing:'0.08em', marginBottom:8 }}>SCAN LOG</div>
            <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
              {log.map(entry => (
                <div key={entry.id} style={{ display:'flex', alignItems:'center', gap:10, fontSize:12 }}>
                  <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:C.muted, minWidth:64 }}>{entry.time}</span>
                  <span style={{ fontFamily:"'JetBrains Mono',monospace", fontWeight:700, color:C.orange }}>{entry.pn}</span>
                  <span style={{ color:{
                    matched:C.green, over:C.yellow, partial:C.blue, notfound:C.red,
                  }[entry.scanStatus] || C.muted, fontSize:11, fontWeight:600 }}>
                    {{ matched:'✓ MATCHED', over:'⚠ OVER QTY', partial:'~ PARTIAL', notfound:'✗ NOT FOUND' }[entry.scanStatus]}
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* ── RIGHT: session info ─────────── */}
      <div style={{
        width:210, flexShrink:0, background:C.surface, borderLeft:`1px solid ${C.border}`,
        padding:16, display:'flex', flexDirection:'column', gap:20, overflowY:'auto',
      }}>
        {/* radial progress */}
        <div style={{ textAlign:'center', paddingTop:4 }}>
          <div style={{ fontSize:9, fontWeight:700, color:C.muted, letterSpacing:'0.08em', marginBottom:12 }}>PROGRESS</div>
          <svg width={100} height={100} style={{ display:'block', margin:'0 auto' }}>
            <circle cx={50} cy={50} r={38} fill="none" stroke={C.s3} strokeWidth={8} />
            <circle cx={50} cy={50} r={38} fill="none"
              stroke={progress===100 ? C.green : C.orange} strokeWidth={8}
              strokeDasharray={`${2*Math.PI*38}`}
              strokeDashoffset={`${2*Math.PI*38*(1-progress/100)}`}
              strokeLinecap="round" transform="rotate(-90 50 50)"
              style={{ transition:'stroke-dashoffset .5s ease' }}
            />
            <text x={50} y={46} textAnchor="middle" fill={C.text}
              fontSize={18} fontWeight={900} fontFamily="'Inter',sans-serif">{Math.round(progress)}%</text>
            <text x={50} y={60} textAnchor="middle" fill={C.muted}
              fontSize={9} fontFamily="'Inter',sans-serif" letterSpacing={1}>DONE</text>
          </svg>
        </div>

        <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:16 }}>
          <div style={{ fontSize:9, fontWeight:700, color:C.muted, letterSpacing:'0.08em', marginBottom:10 }}>SESSION INFO</div>
          {[
            ['PO', session.po], ['DELIVERY', session.del],
            ['Lines', `${total}`], ['Scans', `${scanCount}`],
          ].map(([k,v]) => (
            <div key={k} style={{ display:'flex', justifyContent:'space-between', marginBottom:9, gap:8 }}>
              <span style={{ fontSize:11, color:C.muted }}>{k}</span>
              <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, fontWeight:700, color:C.text, textAlign:'right', wordBreak:'break-all' }}>{v}</span>
            </div>
          ))}
        </div>

        {/* item status breakdown */}
        <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:16 }}>
          <div style={{ fontSize:9, fontWeight:700, color:C.muted, letterSpacing:'0.08em', marginBottom:10 }}>BY STATUS</div>
          {['pending','partial','matched','over'].map(st => {
            const count = items.filter(i=>getStatus(i)===st).length;
            if (!count && st!=='matched') return null;
            const cfg = STATUSES[st];
            return (
              <div key={st} style={{ display:'flex', justifyContent:'space-between', marginBottom:7, alignItems:'center' }}>
                <span style={{ fontSize:10, color:cfg.fg, fontWeight:600, letterSpacing:'0.05em' }}>{cfg.label}</span>
                <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12, fontWeight:800, color:cfg.fg }}>{count}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════════════
   SCREEN 3 — SUMMARY + LABEL PRINT
═══════════════════════════════════════════════════ */
const SummaryScreen = ({ session, results, onNew }) => {
  const { items, log, scanCount } = results;
  const ts = dateStr();
  const notFoundPns = [...new Set(log.filter(l=>l.scanStatus==='notfound').map(l=>l.pn))];
  const overItems   = items.filter(i=>i.scanned>i.qty);
  const missItems   = items.filter(i=>i.scanned<i.qty);
  const allGood     = notFoundPns.length===0 && overItems.length===0 && missItems.length===0;

  // Zebra label print — opens a popup styled at exactly 12.8cm × 6.3cm
  const printLabel = (item) => {
    const w = window.open('', '_blank', 'width=600,height=400,toolbar=0,menubar=0');
    const st = getStatus(item);
    const stLabel = { matched:'✓ MATCHED', over:'⚠ OVER QTY', partial:'✗ PARTIAL', pending:'⚪ PENDING' }[st];
    const stColor = { matched:'#166534', over:'#78350f', partial:'#7f1d1d', pending:'#1e2033' }[st];
    const stText  = { matched:'#22c55e', over:'#fbbf24', partial:'#fca5a5', pending:'#8b8fa8' }[st];
    w.document.write(`<!DOCTYPE html><html><head>
      <meta charset="UTF-8">
      <title>Label — ${item.pn}</title>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
      <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#f4f4f4;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif;gap:16px;}
        .label{width:12.8cm;height:6.3cm;background:#fff;border:1.5px solid #111;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;}
        .hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:5px;}
        .brand{font-size:10px;font-weight:900;letter-spacing:0.06em;}
        .org{font-size:8px;color:#555;letter-spacing:0.04em;text-align:right;}
        .pn-block{margin:4px 0;}
        .pn-lbl{font-size:7.5px;font-weight:700;letter-spacing:0.1em;color:#888;}
        .pn-val{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:900;color:#111;line-height:1.1;}
        .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
        .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
        .f-lbl{font-size:7px;font-weight:700;letter-spacing:0.1em;color:#888;}
        .f-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;color:#111;margin-top:1px;}
        .status{display:inline-block;padding:2px 7px;border-radius:3px;font-size:9px;font-weight:800;letter-spacing:0.08em;}
        .ftr{border-top:1px solid #ddd;padding-top:5px;display:flex;justify-content:space-between;align-items:center;}
        .ftr-txt{font-size:8px;color:#888;}
        .btn{padding:9px 22px;border:none;border-radius:6px;background:#f47c1f;color:#fff;font-weight:800;font-size:13px;cursor:pointer;letter-spacing:0.02em;}
        @media print{body{background:#fff;}button{display:none!important;}.label{border:1px solid #111;}}
      </style>
    </head><body>
      <div class="label">
        <div class="hdr">
          <div class="brand"><span style="color:#f47c1f;">ARROW</span> ELECTRONICS</div>
          <div class="org">MICROSOFT DEPT · SEVENUM NL</div>
        </div>
        <div class="pn-block">
          <div class="pn-lbl">PART NUMBER</div>
          <div class="pn-val">${item.pn}</div>
        </div>
        <div class="row">
          <div><div class="f-lbl">QTY EXPECTED</div><div class="f-val">${item.qty}</div></div>
          <div><div class="f-lbl">QTY VERIFIED</div><div class="f-val">${item.scanned}</div></div>
          <div><div class="f-lbl">COUNTRY OF ORIGIN</div><div class="f-val">${item.coo}</div></div>
        </div>
        <div class="row2">
          <div><div class="f-lbl">PO NUMBER</div><div class="f-val">${session.po}</div></div>
          <div><div class="f-lbl">DELIVERY NUMBER</div><div class="f-val">${session.del}</div></div>
        </div>
        <div class="ftr">
          <span class="ftr-txt">RECONCILED: ${ts}</span>
          <span class="status" style="background:${stColor};color:${stText};">${stLabel}</span>
        </div>
      </div>
      <button class="btn" onclick="window.print()">🖨&nbsp; Print on Zebra ZT</button>
    </body></html>`);
    w.document.close();
  };

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'32px 0' }}>
      <div style={{ maxWidth:860, margin:'0 auto', padding:'0 28px' }}>

        {/* header */}
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:24 }}>
          <div>
            <h1 style={{ fontSize:22, fontWeight:800, color:C.text, letterSpacing:'-0.02em' }}>Session Complete</h1>
            <p style={{ color:C.sec, fontSize:12, marginTop:3 }}>
              {ts} · PO {session.po} · DEL {session.del} · {scanCount} scans
            </p>
          </div>
          <button onClick={onNew} style={{
            display:'flex', alignItems:'center', gap:6,
            padding:'8px 16px', borderRadius:7, border:`1px solid ${C.border}`,
            background:'transparent', color:C.sec, cursor:'pointer', fontSize:13, fontWeight:600,
          }}>
            <Svg name="reset" size={13} color={C.sec} /> New Session
          </button>
        </div>

        {/* status banner */}
        <div style={{
          padding:'14px 18px', borderRadius:10, marginBottom:20,
          background: allGood ? 'rgba(35,197,94,0.07)' : 'rgba(239,68,68,0.07)',
          border:`1px solid ${allGood ? C.green : C.red}`,
          display:'flex', alignItems:'center', gap:14,
        }}>
          <div style={{
            width:36, height:36, borderRadius:'50%', flexShrink:0,
            background: allGood ? C.green : C.red,
            display:'flex', alignItems:'center', justifyContent:'center',
          }}>
            <Svg name={allGood?'check':'warn'} size={18} color="#fff" />
          </div>
          <div>
            <div style={{ fontSize:14, fontWeight:700, color:C.text }}>
              {allGood ? 'All Clear — Packing list fully reconciled' : `Discrepancies Found — Review before entering in WMS`}
            </div>
            <div style={{ fontSize:12, color:C.sec, marginTop:2 }}>
              {items.filter(i=>i.scanned===i.qty).length}/{items.length} lines matched
              {notFoundPns.length>0 && ` · ${notFoundPns.length} unknown PN(s)`}
              {overItems.length>0 && ` · ${overItems.length} over-quantity`}
              {missItems.length>0 && ` · ${missItems.length} short`}
            </div>
          </div>
        </div>

        {/* not-found alert */}
        {notFoundPns.length > 0 && (
          <div style={{
            padding:'12px 16px', borderRadius:8, marginBottom:16,
            background:'rgba(239,68,68,0.07)', border:`1px solid ${C.red}`,
          }}>
            <div style={{ fontSize:11, fontWeight:700, color:C.red, letterSpacing:'0.06em', marginBottom:6 }}>UNKNOWN PART NUMBERS SCANNED</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
              {notFoundPns.map(pn=>(
                <span key={pn} style={{
                  fontFamily:"'JetBrains Mono',monospace", fontSize:12, fontWeight:700,
                  padding:'3px 10px', borderRadius:4, background:'rgba(239,68,68,0.15)', color:'#fca5a5',
                }}>{pn}</span>
              ))}
            </div>
          </div>
        )}

        {/* results table */}
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, overflow:'hidden', marginBottom:24 }}>
          <div style={{ padding:'11px 16px', borderBottom:`1px solid ${C.border}` }}>
            <div style={{ fontSize:9, fontWeight:700, color:C.muted, letterSpacing:'0.08em' }}>RECONCILIATION RESULTS</div>
          </div>
          <table style={{ width:'100%', borderCollapse:'collapse' }}>
            <thead>
              <tr style={{ background:C.s3 }}>
                {['PART NUMBER','EXPECTED','SCANNED','DELTA','COO','STATUS','LABEL'].map((h,i)=>(
                  <th key={h} style={{
                    padding:'7px 14px', textAlign:[1,2,3].includes(i)?'center':'left',
                    fontSize:9, fontWeight:700, color:C.muted, letterSpacing:'0.07em',
                    borderBottom:`1px solid ${C.border}`,
                  }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {items.map((item) => {
                const st = getStatus(item);
                const delta = item.scanned - item.qty;
                const rowBg = st!=='matched' && st!=='pending' ? 'rgba(239,68,68,0.04)' : 'transparent';
                return (
                  <tr key={item.id} style={{ borderBottom:`1px solid ${C.border}`, background:rowBg }}>
                    <td style={{ padding:'11px 14px', fontFamily:"'JetBrains Mono',monospace", fontSize:13, fontWeight:800, color:C.orange }}>{item.pn}</td>
                    <td style={{ padding:'11px 14px', textAlign:'center', fontFamily:"'JetBrains Mono',monospace", fontSize:13, color:C.sec }}>{item.qty}</td>
                    <td style={{ padding:'11px 14px', textAlign:'center', fontFamily:"'JetBrains Mono',monospace", fontSize:14, fontWeight:800,
                      color:{matched:C.green,over:C.yellow,partial:C.blue,pending:C.muted}[st]||C.text }}>{item.scanned}</td>
                    <td style={{ padding:'11px 14px', textAlign:'center', fontFamily:"'JetBrains Mono',monospace", fontSize:13, fontWeight:700,
                      color:delta===0?C.muted:delta>0?C.yellow:C.red }}>
                      {delta===0?'—':delta>0?`+${delta}`:delta}
                    </td>
                    <td style={{ padding:'11px 14px', fontSize:12, color:C.sec }}>{item.coo}</td>
                    <td style={{ padding:'11px 14px' }}><Badge status={st} /></td>
                    <td style={{ padding:'11px 14px' }}>
                      <button onClick={()=>printLabel(item)} style={{
                        display:'flex', alignItems:'center', gap:5,
                        padding:'5px 10px', borderRadius:6, border:`1px solid ${C.border}`,
                        background:C.s2, color:C.sec, cursor:'pointer', fontSize:11, fontWeight:600,
                        whiteSpace:'nowrap',
                      }}>
                        <Svg name="print" size={12} color={C.sec} /> Print
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* label note */}
        <div style={{
          padding:'12px 16px', borderRadius:8, fontSize:12, color:C.sec,
          background:C.surface, border:`1px solid ${C.border}`,
          display:'flex', alignItems:'center', gap:10,
        }}>
          <Svg name="print" size={15} color={C.muted} />
          Labels print at <strong style={{color:C.text}}>12.8 × 6.3 cm</strong> — optimised for Zebra ZT Industrial thermal printers.
          Click <em>Print</em> on any row to open the label preview, then press the Zebra print button.
        </div>
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════ */
const Header = ({ screen, session, onReset }) => {
  const screenLabel = { setup:'SETUP', scan:'RECONCILIATION ACTIVE', summary:'SESSION COMPLETE' }[screen];
  const dotColor    = { setup:C.yellow, scan:C.green, summary:C.sec }[screen];
  return (
    <header style={{
      display:'flex', alignItems:'center', justifyContent:'space-between',
      padding:'0 20px', height:52,
      background:C.surface, borderBottom:`1px solid ${C.border}`,
      flexShrink:0, zIndex:50,
    }}>
      <div style={{ display:'flex', alignItems:'center', gap:14 }}>
        {/* logo mark */}
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <div style={{
            width:30, height:30, borderRadius:6, background:C.orange,
            display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
          }}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="white">
              <polygon points="1,8 8,1 15,8 8,8" />
              <polygon points="8,8 15,8 8,15" opacity="0.6" />
            </svg>
          </div>
          <div>
            <div style={{ fontSize:12, fontWeight:800, color:C.text, letterSpacing:'0.04em', lineHeight:1.2 }}>ARROW ELECTRONICS</div>
            <div style={{ fontSize:9, color:C.muted, letterSpacing:'0.06em' }}>MICROSOFT · SEVENUM</div>
          </div>
        </div>
        <div style={{ width:1, height:28, background:C.border }} />
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <div style={{ width:7, height:7, borderRadius:'50%', background:dotColor,
            animation: screen==='scan' ? 'pulse-dot 2s infinite' : 'none' }} />
          <span style={{ fontSize:11, fontWeight:700, color:C.sec, letterSpacing:'0.06em' }}>{screenLabel}</span>
        </div>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:18 }}>
        {session?.po && (
          <div style={{ textAlign:'right' }}>
            <div style={{ fontSize:9, color:C.muted, letterSpacing:'0.07em' }}>PO NUMBER</div>
            <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12, fontWeight:700, color:C.orange }}>{session.po}</div>
          </div>
        )}
        {session?.del && (
          <div style={{ textAlign:'right' }}>
            <div style={{ fontSize:9, color:C.muted, letterSpacing:'0.07em' }}>DELIVERY</div>
            <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12, fontWeight:700, color:C.text }}>{session.del}</div>
          </div>
        )}
        {screen !== 'setup' && (
          <button onClick={onReset} style={{
            display:'flex', alignItems:'center', gap:5, padding:'6px 12px', borderRadius:6,
            border:`1px solid ${C.border}`, background:'transparent', color:C.sec,
            cursor:'pointer', fontSize:12, fontWeight:600,
          }}>
            <Svg name="reset" size={12} color={C.sec} /> New Session
          </button>
        )}
      </div>
    </header>
  );
};

/* ═══════════════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════════════ */
const App = () => {
  const [screen,  setScreen]  = useState('setup');
  const [session, setSession] = useState(null);
  const [results, setResults] = useState(null);

  // persist session in localStorage so a refresh doesn't lose everything
  useEffect(() => {
    try {
      const saved = localStorage.getItem('packmatch_state');
      if (saved) {
        const s = JSON.parse(saved);
        if (s.screen && s.session) { setScreen(s.screen); setSession(s.session); if(s.results) setResults(s.results); }
      }
    } catch(_) {}
  }, []);
  useEffect(() => {
    try { localStorage.setItem('packmatch_state', JSON.stringify({ screen, session, results })); } catch(_) {}
  }, [screen, session, results]);

  const handleStart   = (s) => { setSession(s); setScreen('scan'); };
  const handleComplete = (r) => { setResults(r); setScreen('summary'); };
  const handleReset   = () => { setSession(null); setResults(null); setScreen('setup'); localStorage.removeItem('packmatch_state'); };

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column' }}>
      <Header screen={screen} session={session} onReset={handleReset} />
      {screen==='setup'   && <SetupScreen onStart={handleStart} />}
      {screen==='scan'    && <ScanScreen session={session} onComplete={handleComplete} />}
      {screen==='summary' && <SummaryScreen session={session} results={results} onNew={handleReset} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
