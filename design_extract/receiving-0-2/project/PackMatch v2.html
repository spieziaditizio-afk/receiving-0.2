<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PackMatch — Arrow Electronics | Microsoft WH</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body,#root{height:100%;}
    body{background:#0d0f14;color:#e3e5ef;font-family:'Inter',system-ui,sans-serif;overflow:hidden;}
    input,button{font-family:inherit;}
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-track{background:#141720;}
    ::-webkit-scrollbar-thumb{background:#2c3047;border-radius:3px;}
    @keyframes pulse-dot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(35,197,94,.4);}50%{opacity:.6;box-shadow:0 0 0 6px rgba(35,197,94,0);}}
    @keyframes flash-green{0%{background:rgba(35,197,94,.18);}100%{background:transparent;}}
    @keyframes flash-red{0%{background:rgba(239,68,68,.18);}100%{background:transparent;}}
    @keyframes flash-yellow{0%{background:rgba(245,158,11,.18);}100%{background:transparent;}}
    @keyframes slide-in{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
    @keyframes pop-in{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:none;}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── palette ─────────────────────────────────── */
const C = {
  bg:'#0d0f14', surface:'#141720', s2:'#1b1f2c', s3:'#232839',
  border:'#2c3047', text:'#e3e5ef', sec:'#8890a8', muted:'#565e7a',
  orange:'#f47c1f', green:'#23c55e', greenDim:'#14532d',
  red:'#ef4444', redDim:'#7f1d1d', yellow:'#f59e0b', yellowDim:'#78350f', blue:'#3b82f6',
};

/* ── icons ───────────────────────────────────── */
const PATHS = {
  check:'M20 6 9 17l-5-5', xmark:'M18 6 6 18M6 6l12 12',
  plus:'M12 5v14M5 12h14', trash:'M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6',
  print:'M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z',
  warn:'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01',
  reset:'M1 4v6h6M3.51 15a9 9 0 1 0 .49-4.34',
  arrow:'M5 12h14M12 5l7 7-7 7',
  chevD:'M6 9l6 6 6-6', chevU:'M18 15l-6-6-6 6',
  box:'M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z',
  layers:'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5',
};
const Svg = ({ name, size=16, color='currentColor' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {(PATHS[name]||'').split(/(?=[ML])/).map((seg,i)=><path key={i} d={seg.trim()}/>)}
  </svg>
);

/* ── shared ui ───────────────────────────────── */
const ST = {
  pending:{ label:'PENDING', bg:C.s3, fg:C.muted, br:C.border },
  partial:{ label:'PARTIAL', bg:'#1e3557', fg:C.blue, br:C.blue },
  matched:{ label:'COMPLETE', bg:C.greenDim, fg:C.green, br:C.green },
  over:   { label:'OVER QTY', bg:C.yellowDim, fg:C.yellow, br:C.yellow },
};
const Badge = ({ status }) => { const s=ST[status]||ST.pending; return <span style={{ display:'inline-block', padding:'2px 7px', borderRadius:4, fontSize:10, fontWeight:700, letterSpacing:'0.07em', fontFamily:"'JetBrains Mono',monospace", background:s.bg, color:s.fg, border:`1px solid ${s.br}` }}>{s.label}</span>; };
const PTag = ({ id }) => <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, fontWeight:800, padding:'2px 7px', borderRadius:4, background:'rgba(35,197,94,.12)', color:C.green, border:`1px solid rgba(35,197,94,.25)` }}>{id}</span>;
const inputSx = { width:'100%', padding:'9px 12px', borderRadius:7, background:C.s2, border:`1px solid ${C.border}`, color:C.text, fontSize:13, fontFamily:"'JetBrains Mono',monospace", outline:'none' };
const labelSx = { display:'block', fontSize:9, fontWeight:700, color:C.muted, letterSpacing:'0.08em', marginBottom:4 };
const uid    = () => Math.random().toString(36).slice(2,9);
const pId    = n  => `P${String(n).padStart(2,'0')}`;
const tsNow  = () => new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const dateStr = () => new Date().toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});
const palletStatus = p => p.totalScanned===0?'pending':p.totalScanned<p.qty?'partial':p.totalScanned===p.qty?'matched':'over';

/* ═══════════════════════════════════════════
   SETUP
═══════════════════════════════════════════ */
const DeliveryCard = ({ delivery, palletOffset, index, onChange, onRemove, canRemove }) => {
  const [open, setOpen] = useState(true);
  const [pn,setPn]=useState(''); const [qty,setQty]=useState(''); const [coo,setCoo]=useState(''); const [err,setErr]=useState('');
  const pnRef = useRef();

  const addLine = () => {
    const p=pn.trim().toUpperCase(), q=+qty, c=coo.trim().toUpperCase()||'—';
    if (!p||!q||q<1){setErr('Part Number and Quantity required.');return;}
    if (delivery.lines.find(l=>l.pn===p&&l.coo===c)){setErr(`${p} / ${c} already in this delivery.`);return;}
    onChange({...delivery, lines:[...delivery.lines,{id:uid(),pn:p,qty:q,coo:c}]});
    setPn('');setQty('');setCoo('');setErr(''); pnRef.current?.focus();
  };

  const totalQty = delivery.lines.reduce((s,l)=>s+l.qty,0);
  return (
    <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, marginBottom:12, overflow:'hidden' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, padding:'11px 14px', background:C.s2, cursor:'pointer' }} onClick={()=>setOpen(o=>!o)}>
        <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, fontWeight:800, letterSpacing:'0.07em', padding:'2px 9px', borderRadius:4, background:'rgba(244,124,31,.15)', color:C.orange, border:`1px solid ${C.orange}`, flexShrink:0 }}>DEL {String(index+1).padStart(2,'0')}</span>
        <input value={delivery.number} placeholder="Delivery number e.g. 8100987654" onChange={e=>{e.stopPropagation();onChange({...delivery,number:e.target.value});}} onClick={e=>e.stopPropagation()} style={{...inputSx,flex:1,fontSize:12}}/>
        <span style={{fontSize:11,color:C.muted,whiteSpace:'nowrap'}}>{delivery.lines.length} line{delivery.lines.length!==1?'s':''} · {totalQty} pcs</span>
        {canRemove&&<button onClick={e=>{e.stopPropagation();onRemove();}} style={{background:'none',border:'none',cursor:'pointer',color:C.muted,padding:4,display:'flex'}}><Svg name="xmark" size={13} color={C.muted}/></button>}
        <Svg name={open?'chevU':'chevD'} size={13} color={C.muted}/>
      </div>
      {open&&(
        <div style={{padding:'14px 16px'}}>
          {delivery.lines.length>0&&(
            <table style={{width:'100%',borderCollapse:'collapse',marginBottom:12}}>
              <thead><tr style={{background:C.s3}}>{['PALLET','PART NUMBER','TOTAL QTY','COO',''].map((h,i)=><th key={i} style={{padding:'6px 10px',textAlign:i===2?'center':'left',fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',borderBottom:`1px solid ${C.border}`}}>{h}</th>)}</tr></thead>
              <tbody>
                {delivery.lines.map((line,li)=>(
                  <tr key={line.id} style={{borderBottom:`1px solid ${C.border}`}}>
                    <td style={{padding:'8px 10px'}}><PTag id={pId(palletOffset+li+1)}/></td>
                    <td style={{padding:'8px 10px',fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:700,color:C.orange}}>{line.pn}</td>
                    <td style={{padding:'8px 10px',textAlign:'center',fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:800,color:C.text}}>{line.qty}</td>
                    <td style={{padding:'8px 10px',fontSize:12,color:C.sec}}>{line.coo}</td>
                    <td style={{padding:'8px 10px',textAlign:'right'}}><button onClick={()=>onChange({...delivery,lines:delivery.lines.filter(l=>l.id!==line.id)})} style={{background:'none',border:'none',cursor:'pointer',color:C.muted,padding:4,display:'inline-flex'}}><Svg name="trash" size={13} color={C.muted}/></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
          <div style={{display:'grid',gridTemplateColumns:'2fr 90px 110px auto',gap:8,alignItems:'end'}}>
            <div><label style={labelSx}>PART NUMBER *</label><input ref={pnRef} value={pn} onChange={e=>setPn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addLine()} placeholder="e.g. 0C19551" style={inputSx}/></div>
            <div><label style={labelSx}>TOTAL QTY *</label><input value={qty} onChange={e=>setQty(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addLine()} type="number" min="1" placeholder="0" style={inputSx}/></div>
            <div><label style={labelSx}>COO</label><input value={coo} onChange={e=>setCoo(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addLine()} placeholder="CN / US / MX" style={inputSx}/></div>
            <button onClick={addLine} style={{height:38,padding:'0 14px',borderRadius:7,border:'none',background:C.orange,color:'#fff',cursor:'pointer',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:4}}><Svg name="plus" size={13} color="#fff"/>Add</button>
          </div>
          {err&&<div style={{color:C.red,fontSize:11,marginTop:5}}>{err}</div>}
        </div>
      )}
    </div>
  );
};

const SetupScreen = ({ onStart }) => {
  const [po,setPo]=useState('');
  const [deliveries,setDeliveries]=useState([{id:uid(),number:'',lines:[]}]);
  const update=(id,v)=>setDeliveries(p=>p.map(d=>d.id===id?v:d));
  const remove=(id)=>setDeliveries(p=>p.filter(d=>d.id!==id));
  const offsets=deliveries.reduce((a,d)=>{a.r.push(a.t);a.t+=d.lines.length;return a;},{r:[],t:0}).r;
  const totalPallets=deliveries.reduce((s,d)=>s+d.lines.length,0);
  const totalUnits=deliveries.reduce((s,d)=>s+d.lines.reduce((ss,l)=>ss+l.qty,0),0);
  const canStart=po.trim()&&deliveries.every(d=>d.number.trim())&&totalPallets>0;
  return (
    <div style={{flex:1,overflowY:'auto',padding:'28px 0'}}>
      <div style={{maxWidth:840,margin:'0 auto',padding:'0 24px'}}>
        <div style={{marginBottom:24}}>
          <h1 style={{fontSize:22,fontWeight:800,color:C.text,letterSpacing:'-0.02em'}}>New Reconciliation Session</h1>
          <p style={{color:C.sec,fontSize:13,marginTop:4}}>Enter the packing list. Each line item becomes one pallet (PO + Delivery + PN + COO).</p>
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:'16px 18px',marginBottom:16}}>
          <label style={labelSx}>PO NUMBER *</label>
          <input value={po} onChange={e=>setPo(e.target.value)} placeholder="e.g. 4500123456" style={{...inputSx,maxWidth:340}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em'}}>DELIVERIES</div>
          <button onClick={()=>setDeliveries(p=>[...p,{id:uid(),number:'',lines:[]}])} style={{display:'flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:6,border:`1px solid ${C.border}`,background:C.s2,color:C.sec,cursor:'pointer',fontSize:12,fontWeight:600}}>
            <Svg name="plus" size={12} color={C.sec}/>Add Delivery
          </button>
        </div>
        {deliveries.map((del,i)=><DeliveryCard key={del.id} delivery={del} palletOffset={offsets[i]} index={i} onChange={v=>update(del.id,v)} onRemove={()=>remove(del.id)} canRemove={deliveries.length>1}/>)}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:16}}>
          <div style={{fontSize:12,color:C.muted}}>{totalPallets} pallet{totalPallets!==1?'s':''} · {totalUnits} total pieces · {deliveries.length} delivery{deliveries.length!==1?'s':''}</div>
          <button onClick={()=>canStart&&onStart({po,deliveries})} disabled={!canStart} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 24px',borderRadius:8,border:'none',background:canStart?C.orange:C.s3,color:canStart?'#fff':C.muted,cursor:canStart?'pointer':'not-allowed',fontSize:14,fontWeight:700}}>
            Start Reconciliation <Svg name="arrow" size={14} color={canStart?'#fff':C.muted}/>
          </button>
        </div>
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════
   SCAN SCREEN
═══════════════════════════════════════════ */
const ScanScreen = ({ session, onComplete }) => {
  const buildPallets = () => { let n=1; return session.deliveries.flatMap(del=>del.lines.map(line=>({...line,palletId:pId(n++),delId:del.id,delNumber:del.number,boxes:[],totalScanned:0}))); };
  const [pallets,setPallets] = useState(buildPallets);
  const [activeId,setActiveId] = useState(()=>{ const p=buildPallets(); return p[0]?.palletId||null; });
  const [boxInput,setBoxInput] = useState('');
  const [toasts,setToasts] = useState([]);
  const [flashKey,setFlashKey] = useState(0);
  const [flashType,setFlashType] = useState(null);
  const inputRef = useRef();

  const active = pallets.find(p=>p.palletId===activeId);
  const allComplete = pallets.every(p=>p.totalScanned===p.qty);
  const completedCount = pallets.filter(p=>p.totalScanned===p.qty).length;

  useEffect(()=>{ if(!active?.totalScanned||active.totalScanned<active.qty) inputRef.current?.focus(); },[activeId]);

  const toast = (msg,type) => { const id=Date.now(); setToasts(p=>[{id,msg,type},...p].slice(0,2)); setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),7000); };
  const flash = (type) => { setFlashType(type); setFlashKey(k=>k+1); setTimeout(()=>setFlashType(null),700); };

  const addBox = () => {
    const qty = parseInt(boxInput.trim());
    if (!qty||qty<1||!active){setBoxInput('');return;}
    const newTotal = active.totalScanned+qty;
    if (newTotal>active.qty){
      toast(`Cannot add ${qty} pcs — would exceed expected ${active.qty} (at ${active.totalScanned} now)`,'error');
      flash('red'); setBoxInput(''); return;
    }
    let nextIncompleteId = null;
    setPallets(prev=>{
      const next = prev.map(p=>{
        if (p.palletId!==activeId) return p;
        const newBox={id:uid(),qty,time:tsNow()};
        const boxes=[...p.boxes,newBox];
        const total=boxes.reduce((s,b)=>s+b.qty,0);
        return {...p,boxes,totalScanned:total};
      });
      if (newTotal===active.qty){
        flash('green');
        const ni = next.find(p=>p.palletId!==activeId&&p.totalScanned<p.qty);
        if(ni) nextIncompleteId=ni.palletId;
      }
      return next;
    });
    setBoxInput('');
    if (newTotal===active.qty && nextIncompleteId) setTimeout(()=>setActiveId(nextIncompleteId),700);
    else setTimeout(()=>inputRef.current?.focus(),50);
  };

  const removeBox = (boxId) => {
    setPallets(prev=>prev.map(p=>{
      if (p.palletId!==activeId) return p;
      const boxes=p.boxes.filter(b=>b.id!==boxId);
      return {...p,boxes,totalScanned:boxes.reduce((s,b)=>s+b.qty,0)};
    }));
  };

  const totalExpected = pallets.reduce((s,p)=>s+p.qty,0);
  const totalScanned  = pallets.reduce((s,p)=>s+p.totalScanned,0);
  const totalBoxes    = pallets.reduce((s,p)=>s+p.boxes.length,0);
  const overallPct    = pallets.length ? completedCount/pallets.length*100 : 0;

  return (
    <div style={{flex:1,display:'flex',overflow:'hidden'}}>

      {/* LEFT — pallet list */}
      <div style={{width:290,flexShrink:0,background:C.surface,borderRight:`1px solid ${C.border}`,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'12px 14px',borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
          <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:2}}>PALLETS — PO {session.po}</div>
          <div style={{fontSize:12,color:C.sec}}>{completedCount}/{pallets.length} pallets complete</div>
          <div style={{height:3,background:C.s3,borderRadius:2,marginTop:6}}>
            <div style={{height:'100%',width:`${overallPct}%`,background:allComplete?C.green:C.orange,borderRadius:2,transition:'width .4s'}}/>
          </div>
        </div>
        <div style={{flex:1,overflowY:'auto'}}>
          {session.deliveries.map(del=>{
            const dp=pallets.filter(p=>p.delId===del.id);
            const dm=dp.filter(p=>p.totalScanned===p.qty).length;
            return (
              <div key={del.id}>
                <div style={{padding:'6px 14px',fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.07em',background:C.s2,borderBottom:`1px solid ${C.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",color:C.sec,fontSize:10}}>{del.number}</span>
                  <span>{dm}/{dp.length}</span>
                </div>
                <div style={{padding:'8px 10px',display:'flex',flexDirection:'column',gap:6}}>
                  {dp.map(p=>{
                    const st=palletStatus(p);
                    const isAct=p.palletId===activeId;
                    const pct=p.qty>0?Math.min(100,p.totalScanned/p.qty*100):0;
                    const done=p.totalScanned===p.qty;
                    return (
                      <div key={p.id} onClick={()=>setActiveId(p.palletId)} style={{background:isAct?C.s3:C.s2,border:`2px solid ${isAct?C.orange:done?C.green:C.border}`,borderRadius:8,padding:'9px 11px',cursor:'pointer',transition:'all .15s'}}>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><PTag id={p.palletId}/><Badge status={st}/></div>
                        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:800,color:C.orange,marginBottom:2}}>{p.pn}</div>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                          <span style={{fontSize:10,color:C.muted}}>COO: {p.coo} · {p.boxes.length} box{p.boxes.length!==1?'es':''}</span>
                          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:800}}>
                            <span style={{color:{matched:C.green,over:C.yellow,partial:C.blue,pending:C.text}[st]}}>{p.totalScanned}</span>
                            <span style={{color:C.muted}}>/{p.qty}</span>
                          </span>
                        </div>
                        <div style={{height:2,background:C.s3,borderRadius:1}}>
                          <div style={{height:'100%',width:`${pct}%`,borderRadius:1,background:{matched:C.green,over:C.yellow,partial:C.blue,pending:C.border}[st],transition:'width .3s'}}/>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* CENTER — active pallet */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',animation:flashType?`flash-${flashType} .6s ease forwards`:'none'}} key={`fl-${flashKey}`}>
        {toasts.length>0&&(
          <div style={{padding:'10px 16px 0',flexShrink:0,display:'flex',flexDirection:'column',gap:5}}>
            {toasts.map(t=>(
              <div key={t.id} style={{display:'flex',alignItems:'center',gap:8,padding:'9px 13px',borderRadius:7,background:t.type==='error'?'#3b0f0f':'#3b2a0a',border:`1px solid ${t.type==='error'?C.red:C.yellow}`,color:t.type==='error'?'#fca5a5':'#fde68a',fontSize:13,fontWeight:600,animation:'slide-in .2s ease'}}>
                <Svg name="warn" size={14} color={t.type==='error'?C.red:C.yellow}/>{t.msg}
              </div>
            ))}
          </div>
        )}

        {active ? (
          <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>

            {/* Pallet header */}
            <div style={{padding:'16px 24px',borderBottom:`1px solid ${C.border}`,background:C.s2,flexShrink:0}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,flexWrap:'wrap'}}>
                <PTag id={active.palletId}/>
                <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:22,fontWeight:900,color:C.orange}}>{active.pn}</div>
                <div style={{fontSize:13,color:C.sec}}>COO: <strong style={{color:C.text}}>{active.coo}</strong></div>
                <div style={{fontSize:13,color:C.sec}}>DEL: <strong style={{color:C.text,fontFamily:"'JetBrains Mono',monospace"}}>{active.delNumber}</strong></div>
                <div style={{marginLeft:'auto'}}><Badge status={palletStatus(active)}/></div>
              </div>
              {/* Progress bar */}
              <div style={{display:'flex',alignItems:'center',gap:14}}>
                <div style={{flex:1,height:10,background:C.s3,borderRadius:5,overflow:'hidden'}}>
                  <div style={{height:'100%',borderRadius:5,transition:'width .4s ease',width:`${active.qty>0?Math.min(100,active.totalScanned/active.qty*100):0}%`,background:active.totalScanned===active.qty?C.green:C.orange}}/>
                </div>
                <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:22,fontWeight:900,whiteSpace:'nowrap'}}>
                  <span style={{color:active.totalScanned===active.qty?C.green:C.text}}>{active.totalScanned}</span>
                  <span style={{color:C.muted}}> / {active.qty} pcs</span>
                </div>
              </div>
              {active.totalScanned===active.qty&&(
                <div style={{marginTop:8,display:'flex',alignItems:'center',gap:6}}>
                  <span style={{color:C.green,fontSize:13,fontWeight:700}}>✓ Pallet complete — {active.boxes.length} boxes · {active.totalScanned} pieces</span>
                </div>
              )}
              {active.totalScanned>0&&active.totalScanned<active.qty&&(
                <div style={{marginTop:6,fontSize:12,color:C.sec}}>{active.qty-active.totalScanned} pcs still needed</div>
              )}
            </div>

            {/* Box list */}
            <div style={{flex:1,overflowY:'auto',padding:'16px 24px'}}>
              {active.boxes.length===0?(
                <div style={{textAlign:'center',padding:'32px 0',color:C.muted}}>
                  <Svg name="box" size={36} color={C.border}/>
                  <div style={{marginTop:12,fontSize:13}}>No boxes counted yet</div>
                  <div style={{fontSize:11,marginTop:4}}>Enter the piece count for each box on this pallet</div>
                </div>
              ):(
                <div>
                  <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:10}}>BOXES ON {active.palletId}</div>
                  <div style={{display:'flex',flexDirection:'column',gap:6}}>
                    {active.boxes.map((box,i)=>(
                      <div key={box.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:C.s2,border:`1px solid ${C.border}`,borderRadius:8,animation:'pop-in .15s ease'}}>
                        <span style={{fontSize:12,color:C.muted,fontWeight:600,minWidth:52}}>Box {String(i+1).padStart(2,'0')}</span>
                        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:18,fontWeight:900,color:C.text}}>{box.qty}</span>
                        <span style={{fontSize:12,color:C.muted}}>pcs</span>
                        <span style={{fontSize:10,color:C.muted,marginLeft:'auto'}}>{box.time}</span>
                        <button onClick={()=>removeBox(box.id)} style={{background:'none',border:'none',cursor:'pointer',color:C.muted,padding:4,display:'flex',borderRadius:4}}>
                          <Svg name="trash" size={13} color={C.muted}/>
                        </button>
                      </div>
                    ))}
                    {/* Total row */}
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px',background:C.s3,border:`1px solid ${C.border}`,borderRadius:8,marginTop:2}}>
                      <span style={{fontSize:12,fontWeight:700,color:C.sec}}>{active.boxes.length} boxes total</span>
                      <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:18,fontWeight:900,color:active.totalScanned===active.qty?C.green:C.text}}>{active.totalScanned} pcs</span>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* Box entry */}
            {active.totalScanned<active.qty&&(
              <div style={{padding:'14px 24px',borderTop:`1px solid ${C.border}`,background:C.surface,flexShrink:0}}>
                <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.07em',marginBottom:7,display:'flex',alignItems:'center',gap:6}}>
                  <span style={{display:'inline-block',width:7,height:7,borderRadius:'50%',background:C.green,animation:'pulse-dot 2s infinite'}}/>
                  QTY FOR NEXT BOX — {active.qty-active.totalScanned} pcs still to count
                </div>
                <div style={{display:'flex',gap:10}}>
                  <input ref={inputRef} value={boxInput} onChange={e=>setBoxInput(e.target.value.replace(/\D/,''))} onKeyDown={e=>e.key==='Enter'&&addBox()}
                    type="number" min="1" placeholder="Pieces in this box…" autoFocus
                    style={{...inputSx,fontSize:20,fontWeight:800,padding:'12px 16px',height:54,border:`2px solid ${C.orange}`,borderRadius:10,flex:1}}/>
                  <button onClick={addBox} style={{padding:'0 22px',height:54,borderRadius:10,border:'none',background:C.orange,color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>
                    Add Box
                  </button>
                </div>
                <div style={{fontSize:11,color:C.muted,marginTop:5}}>Scan or type piece count from box label · Press Enter to confirm</div>
              </div>
            )}
            {active.totalScanned===active.qty&&(
              <div style={{padding:'14px 24px',borderTop:`1px solid ${C.border}`,background:'rgba(35,197,94,.06)',flexShrink:0,textAlign:'center',color:C.green,fontWeight:700,fontSize:13}}>
                ✓ Pallet {active.palletId} is complete. Select the next pallet →
              </div>
            )}
          </div>
        ):(
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:C.muted,fontSize:13,flexDirection:'column',gap:10}}>
            <Svg name="layers" size={36} color={C.border}/>
            <span>Select a pallet from the left to start</span>
          </div>
        )}
      </div>

      {/* RIGHT — totals + completion */}
      <div style={{width:210,flexShrink:0,background:C.surface,borderLeft:`1px solid ${C.border}`,padding:14,display:'flex',flexDirection:'column',gap:12,overflowY:'auto'}}>
        {/* circular */}
        <div style={{textAlign:'center',paddingTop:4}}>
          <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:10}}>OVERALL</div>
          <svg width={90} height={90} style={{display:'block',margin:'0 auto'}}>
            <circle cx={45} cy={45} r={34} fill="none" stroke={C.s3} strokeWidth={7}/>
            <circle cx={45} cy={45} r={34} fill="none" stroke={allComplete?C.green:C.orange} strokeWidth={7}
              strokeDasharray={`${2*Math.PI*34}`} strokeDashoffset={`${2*Math.PI*34*(1-overallPct/100)}`}
              strokeLinecap="round" transform="rotate(-90 45 45)" style={{transition:'stroke-dashoffset .5s ease'}}/>
            <text x={45} y={42} textAnchor="middle" fill={C.text} fontSize={16} fontWeight={900} fontFamily="'Inter',sans-serif">{Math.round(overallPct)}%</text>
            <text x={45} y={55} textAnchor="middle" fill={C.muted} fontSize={8} fontFamily="'Inter',sans-serif" letterSpacing={1}>DONE</text>
          </svg>
        </div>

        {/* stats */}
        <div style={{borderTop:`1px solid ${C.border}`,paddingTop:12}}>
          <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:8}}>SHIPMENT TOTALS</div>
          {[['PO',session.po],['Pallets',`${completedCount}/${pallets.length}`],['Expected pcs',totalExpected],['Counted pcs',totalScanned],['Boxes',totalBoxes]].map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',marginBottom:7,gap:6}}>
              <span style={{fontSize:11,color:C.muted}}>{k}</span>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:700,color:C.text,textAlign:'right',wordBreak:'break-all'}}>{v}</span>
            </div>
          ))}
        </div>

        {/* pallet status list */}
        <div style={{borderTop:`1px solid ${C.border}`,paddingTop:12}}>
          <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:8}}>PALLET STATUS</div>
          {pallets.map(p=>(
            <div key={p.id} onClick={()=>setActiveId(p.palletId)} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:7,cursor:'pointer',padding:'3px 0'}}>
              <PTag id={p.palletId}/>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:700,color:p.totalScanned===p.qty?C.green:p.totalScanned>0?C.blue:C.muted}}>{p.totalScanned}/{p.qty}</span>
            </div>
          ))}
        </div>

        {/* CTA */}
        <div style={{marginTop:'auto',paddingTop:12}}>
          {allComplete?(
            <button onClick={()=>onComplete({pallets})} style={{width:'100%',padding:'11px 0',borderRadius:8,border:'none',background:C.green,color:'#fff',fontSize:13,fontWeight:800,cursor:'pointer'}}>
              ✓ Complete &amp; Print Labels
            </button>
          ):(
            <div style={{padding:'10px',background:C.s2,borderRadius:8,border:`1px solid ${C.border}`,fontSize:11,color:C.muted,textAlign:'center',lineHeight:1.5}}>
              <span style={{color:C.yellow,fontWeight:700}}>100% required</span><br/>No partial shipments
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

const SummaryScreen = ({ session, results, onNew }) => {
  const { pallets } = results;
  const ts = dateStr();
  const totalPcs   = pallets.reduce((s,p)=>s+p.totalScanned,0);
  const totalBoxes = pallets.reduce((s,p)=>s+p.boxes.length,0);
  const byDel = session.deliveries.map(del=>({...del,pallets:pallets.filter(p=>p.delId===del.id)}));

  return (
    <div style={{flex:1,overflowY:'auto',padding:'28px 0'}}>
      <div style={{maxWidth:920,margin:'0 auto',padding:'0 24px'}}>

        {/* header */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>
          <div>
            <h1 style={{fontSize:22,fontWeight:800,color:C.text,letterSpacing:'-0.02em'}}>Shipment Reconciled</h1>
            <p style={{color:C.sec,fontSize:12,marginTop:3}}>{ts} · PO {session.po} · {pallets.length} pallets · {totalBoxes} boxes · {totalPcs} pcs</p>
          </div>
          <button onClick={onNew} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:7,border:`1px solid ${C.border}`,background:'transparent',color:C.sec,cursor:'pointer',fontSize:12,fontWeight:600}}>
            <Svg name="reset" size={12} color={C.sec}/>New Session
          </button>
        </div>

        {/* status banner */}
        <div style={{padding:'14px 18px',borderRadius:10,marginBottom:18,background:'rgba(35,197,94,.07)',border:`1px solid ${C.green}`,display:'flex',alignItems:'center',gap:14}}>
          <div style={{width:36,height:36,borderRadius:'50%',background:C.green,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <Svg name="check" size={18} color="#fff"/>
          </div>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:C.text}}>All Clear — 100% reconciled. Ready for WMS entry.</div>
            <div style={{fontSize:12,color:C.sec,marginTop:2}}>{pallets.length} pallets · {totalBoxes} boxes · {totalPcs} total pieces</div>
          </div>
        </div>

        {/* print actions */}
        <div style={{display:'flex',gap:10,marginBottom:24}}>
          <button onClick={()=>printShipmentSummary(session,pallets)} style={{display:'flex',alignItems:'center',gap:8,padding:'11px 20px',borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,color:C.text,cursor:'pointer',fontSize:13,fontWeight:700}}>
            <Svg name="print" size={15} color={C.orange}/>Print Shipment Summary
          </button>
          <button onClick={()=>pallets.forEach((p,i)=>setTimeout(()=>printPalletLabel(p,session),i*300))} style={{display:'flex',alignItems:'center',gap:8,padding:'11px 20px',borderRadius:8,border:'none',background:C.orange,color:'#fff',cursor:'pointer',fontSize:13,fontWeight:700}}>
            <Svg name="print" size={15} color="#fff"/>Print All Pallet Labels
          </button>
        </div>

        {/* per-delivery tables */}
        {byDel.map(del=>(
          <div key={del.id} style={{marginBottom:24}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
              <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em'}}>DELIVERY</div>
              <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:800,color:C.sec}}>{del.number}</div>
            </div>
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:'hidden'}}>
              <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead>
                  <tr style={{background:C.s3}}>
                    {['PALLET','PART NUMBER','COO','BOXES','TOTAL PCS','LABEL'].map((h,i)=>(
                      <th key={h} style={{padding:'7px 14px',textAlign:[3,4].includes(i)?'center':'left',fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.07em',borderBottom:`1px solid ${C.border}`}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {del.pallets.map(p=>(
                    <tr key={p.id} style={{borderBottom:`1px solid ${C.border}`}}>
                      <td style={{padding:'11px 14px'}}><PTag id={p.palletId}/></td>
                      <td style={{padding:'11px 14px',fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:900,color:C.orange}}>{p.pn}</td>
                      <td style={{padding:'11px 14px',fontSize:12,color:C.sec,fontWeight:600}}>{p.coo}</td>
                      <td style={{padding:'11px 14px',textAlign:'center',fontFamily:"'JetBrains Mono',monospace",fontSize:15,fontWeight:900,color:C.text}}>{p.boxes.length}</td>
                      <td style={{padding:'11px 14px',textAlign:'center',fontFamily:"'JetBrains Mono',monospace",fontSize:18,fontWeight:900,color:C.green}}>{p.totalScanned}</td>
                      <td style={{padding:'11px 14px'}}>
                        <button onClick={()=>printPalletLabel(p,session)} style={{display:'flex',alignItems:'center',gap:5,padding:'5px 10px',borderRadius:6,border:`1px solid ${C.border}`,background:C.s2,color:C.sec,cursor:'pointer',fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>
                          <Svg name="print" size={12} color={C.sec}/>Label
                        </button>
                      </td>
                    </tr>
                  ))}
                  {/* delivery subtotal */}
                  <tr style={{background:C.s2}}>
                    <td colSpan={3} style={{padding:'8px 14px',fontSize:11,color:C.muted,fontWeight:600}}>Delivery total</td>
                    <td style={{padding:'8px 14px',textAlign:'center',fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:800,color:C.text}}>{del.pallets.reduce((s,p)=>s+p.boxes.length,0)}</td>
                    <td style={{padding:'8px 14px',textAlign:'center',fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:800,color:C.text}}>{del.pallets.reduce((s,p)=>s+p.totalScanned,0)}</td>
                    <td></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        ))}

        {/* grand total */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:'14px 18px',display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,color:C.sec}}>SHIPMENT GRAND TOTAL — PO {session.po}</div>
          <div style={{display:'flex',gap:28}}>
            {[[pallets.length,'PALLETS'],[totalBoxes,'BOXES'],[totalPcs,'PIECES']].map(([v,l])=>(
              <div key={l} style={{textAlign:'center'}}>
                <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:22,fontWeight:900,color:C.green}}>{v}</div>
                <div style={{fontSize:9,color:C.muted,letterSpacing:'0.07em'}}>{l}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{padding:'12px 16px',borderRadius:8,fontSize:12,color:C.sec,background:C.surface,border:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:10}}>
          <Svg name="print" size={14} color={C.muted}/>
          <span>Pallet label: <strong style={{color:C.text}}>12.8 × 6.3 cm</strong> with box breakdown · Summary: same label format for Zebra ZT Industrial. Click "Print All" to open all pallet labels at once.</span>
        </div>
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════
   HEADER + APP
═══════════════════════════════════════════ */
const Header = ({ screen, session, onReset }) => (
  <header style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 20px',height:52,background:C.surface,borderBottom:`1px solid ${C.border}`,flexShrink:0,zIndex:50}}>
    <div style={{display:'flex',alignItems:'center',gap:14}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <div style={{width:30,height:30,borderRadius:6,background:C.orange,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="white"><polygon points="1,8 8,1 15,8 8,8"/><polygon points="8,8 15,8 8,15" opacity=".6"/></svg>
        </div>
        <div>
          <div style={{fontSize:12,fontWeight:800,color:C.text,letterSpacing:'0.04em',lineHeight:1.2}}>ARROW ELECTRONICS</div>
          <div style={{fontSize:9,color:C.muted,letterSpacing:'0.06em'}}>MICROSOFT · SEVENUM</div>
        </div>
      </div>
      <div style={{width:1,height:28,background:C.border}}/>
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <div style={{width:7,height:7,borderRadius:'50%',background:{setup:C.yellow,scan:C.green,summary:C.sec}[screen],animation:screen==='scan'?'pulse-dot 2s infinite':'none'}}/>
        <span style={{fontSize:10,fontWeight:700,color:C.sec,letterSpacing:'0.06em'}}>{{setup:'SETUP',scan:'RECONCILIATION ACTIVE',summary:'SESSION COMPLETE'}[screen]}</span>
      </div>
    </div>
    <div style={{display:'flex',alignItems:'center',gap:18}}>
      {session?.po&&<div style={{textAlign:'right'}}><div style={{fontSize:9,color:C.muted,letterSpacing:'0.07em'}}>PO</div><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:700,color:C.orange}}>{session.po}</div></div>}
      {session?.deliveries&&<div style={{textAlign:'right'}}><div style={{fontSize:9,color:C.muted,letterSpacing:'0.07em'}}>DELIVERIES</div><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:700,color:C.text}}>{session.deliveries.length}</div></div>}
      {screen!=='setup'&&<button onClick={onReset} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',borderRadius:6,border:`1px solid ${C.border}`,background:'transparent',color:C.sec,cursor:'pointer',fontSize:12,fontWeight:600}}><Svg name="reset" size={12} color={C.sec}/>New Session</button>}
    </div>
  </header>
);

const App = () => {
  const [screen,setScreen]=useState('setup');
  const [session,setSession]=useState(null);
  const [results,setResults]=useState(null);

  useEffect(()=>{try{const s=JSON.parse(localStorage.getItem('pm3')||'null');if(s?.screen&&s?.session){setScreen(s.screen);setSession(s.session);if(s.results)setResults(s.results);}}catch(_){};},[]);
  useEffect(()=>{try{localStorage.setItem('pm3',JSON.stringify({screen,session,results}));}catch(_){};},[screen,session,results]);

  const reset=()=>{setSession(null);setResults(null);setScreen('setup');localStorage.removeItem('pm3');};

  return (
    <div style={{height:'100%',display:'flex',flexDirection:'column'}}>
      <style>{`input:focus{outline:2px solid ${C.orange}!important;outline-offset:0;}button:hover{opacity:.9;}`}</style>
      <Header screen={screen} session={session} onReset={reset}/>
      {screen==='setup'   && <SetupScreen onStart={s=>{setSession(s);setScreen('scan');}}/>}
      {screen==='scan'    && <ScanScreen session={session} onComplete={r=>{setResults(r);setScreen('summary');}}/>}
      {screen==='summary' && <SummaryScreen session={session} results={results} onNew={reset}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
