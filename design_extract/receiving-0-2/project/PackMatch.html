<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PackMatch — Arrow Electronics | Microsoft WH</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body,#root{height:100%;}
    body{background:#0d0f14;color:#e3e5ef;font-family:'Inter',system-ui,sans-serif;overflow:hidden;}
    input,button{font-family:inherit;}
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-track{background:#141720;}
    ::-webkit-scrollbar-thumb{background:#2c3047;border-radius:3px;}
    @keyframes pulse-dot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(35,197,94,.4);}50%{opacity:.6;box-shadow:0 0 0 6px rgba(35,197,94,0);}}
    @keyframes flash-green{0%{background:rgba(35,197,94,.18);}100%{background:transparent;}}
    @keyframes flash-red{0%{background:rgba(239,68,68,.18);}100%{background:transparent;}}
    @keyframes flash-yellow{0%{background:rgba(245,158,11,.18);}100%{background:transparent;}}
    @keyframes slide-in{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
    @keyframes pop-in{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:none;}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── palette ─────────────────────────────────── */
const C = {
  bg:'#0d0f14', surface:'#141720', s2:'#1b1f2c', s3:'#232839',
  border:'#2c3047', text:'#e3e5ef', sec:'#8890a8', muted:'#565e7a',
  orange:'#f47c1f', green:'#23c55e', greenDim:'#14532d',
  red:'#ef4444', redDim:'#7f1d1d', yellow:'#f59e0b', yellowDim:'#78350f', blue:'#3b82f6',
};

/* ── icons ───────────────────────────────────── */
const PATHS = {
  check:'M20 6 9 17l-5-5', xmark:'M18 6 6 18M6 6l12 12',
  plus:'M12 5v14M5 12h14', trash:'M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6',
  print:'M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z',
  warn:'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01',
  reset:'M1 4v6h6M3.51 15a9 9 0 1 0 .49-4.34',
  arrow:'M5 12h14M12 5l7 7-7 7',
  chevD:'M6 9l6 6 6-6', chevU:'M18 15l-6-6-6 6',
  box:'M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z',
  layers:'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5',
  scan:'M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10',
  edit:'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z',
  seal:'M9 12l2 2 4-4M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z',
};
const Svg = ({ name, size=16, color='currentColor' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {(PATHS[name]||'').split(/(?=[ML])/).map((seg,i)=><path key={i} d={seg.trim()}/>)}
  </svg>
);

/* ── shared ui ───────────────────────────────── */
const ST = {
  pending:{ label:'PENDING', bg:C.s3, fg:C.muted, br:C.border },
  partial:{ label:'PARTIAL', bg:'#1e3557', fg:C.blue, br:C.blue },
  matched:{ label:'COMPLETE', bg:C.greenDim, fg:C.green, br:C.green },
  over:   { label:'OVER QTY', bg:C.yellowDim, fg:C.yellow, br:C.yellow },
};
const Badge = ({ status }) => { const s=ST[status]||ST.pending; return <span style={{ display:'inline-block', padding:'2px 7px', borderRadius:4, fontSize:10, fontWeight:700, letterSpacing:'0.07em', fontFamily:"'JetBrains Mono',monospace", background:s.bg, color:s.fg, border:`1px solid ${s.br}` }}>{s.label}</span>; };
const PTag = ({ id, open }) => <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, fontWeight:800, padding:'2px 7px', borderRadius:4, background:open?'rgba(244,124,31,.12)':'rgba(35,197,94,.12)', color:open?C.orange:C.green, border:`1px solid ${open?'rgba(244,124,31,.3)':'rgba(35,197,94,.25)'}` }}>{id}</span>;
const inputSx = { width:'100%', padding:'9px 12px', borderRadius:7, background:C.s2, border:`1px solid ${C.border}`, color:C.text, fontSize:13, fontFamily:"'JetBrains Mono',monospace", outline:'none' };
const labelSx = { display:'block', fontSize:9, fontWeight:700, color:C.muted, letterSpacing:'0.08em', marginBottom:4 };
const uid    = () => Math.random().toString(36).slice(2,9);
const pId    = n  => `P${String(n).padStart(2,'0')}`;
const tsNow  = () => new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const dateStr = () => new Date().toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});

/* target helpers */
const palletPcs   = p => p.boxes.reduce((s,b)=>s+b.qty,0);
const targetTotal = t => t.pallets.reduce((s,p)=>s+palletPcs(p),0);
const openPallet  = t => t.pallets.find(p=>!p.sealed);
const targetStatus= t => { const tot=targetTotal(t); return tot===0?'pending':tot<t.targetQty?'partial':tot===t.targetQty?'matched':'over'; };
const realizedPallets = t => t.pallets.filter(p=>p.boxes.length>0);

/* scan field metadata */
const FIELD_ORDER = ['po','delivery','pn','coo','qty'];
const FIELD_LABEL = { po:'PO NUMBER', delivery:'DELIVERY', pn:'PART NUMBER', coo:'COUNTRY OF ORIGIN', qty:'PIECE QTY' };
const FIELD_SHORT = { po:'PO', delivery:'DEL', pn:'PN', coo:'COO', qty:'QTY' };

/* ═══════════════════════════════════════════
   SETUP
═══════════════════════════════════════════ */
const DeliveryCard = ({ delivery, index, onChange, onRemove, canRemove }) => {
  const [open, setOpen] = useState(true);
  const [pn,setPn]=useState(''); const [qty,setQty]=useState(''); const [coo,setCoo]=useState(''); const [err,setErr]=useState('');
  const pnRef = useRef();
  const addLine = () => {
    const p=pn.trim().toUpperCase(), q=+qty, c=coo.trim().toUpperCase()||'—';
    if (!p||!q||q<1){setErr('Part Number and Target Qty required.');return;}
    if (delivery.lines.find(l=>l.pn===p&&l.coo===c)){setErr(`${p} / ${c} already in this delivery.`);return;}
    onChange({...delivery, lines:[...delivery.lines,{id:uid(),pn:p,qty:q,coo:c}]});
    setPn('');setQty('');setCoo('');setErr(''); pnRef.current?.focus();
  };
  const totalQty = delivery.lines.reduce((s,l)=>s+l.qty,0);
  return (
    <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, marginBottom:12, overflow:'hidden' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, padding:'11px 14px', background:C.s2, cursor:'pointer' }} onClick={()=>setOpen(o=>!o)}>
        <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, fontWeight:800, letterSpacing:'0.07em', padding:'2px 9px', borderRadius:4, background:'rgba(244,124,31,.15)', color:C.orange, border:`1px solid ${C.orange}`, flexShrink:0 }}>DEL {String(index+1).padStart(2,'0')}</span>
        <input value={delivery.number} placeholder="Delivery number e.g. 8100987654" onChange={e=>{e.stopPropagation();onChange({...delivery,number:e.target.value});}} onClick={e=>e.stopPropagation()} style={{...inputSx,flex:1,fontSize:12}}/>
        <span style={{fontSize:11,color:C.muted,whiteSpace:'nowrap'}}>{delivery.lines.length} line{delivery.lines.length!==1?'s':''} · {totalQty} pcs target</span>
        {canRemove&&<button onClick={e=>{e.stopPropagation();onRemove();}} style={{background:'none',border:'none',cursor:'pointer',color:C.muted,padding:4,display:'flex'}}><Svg name="xmark" size={13} color={C.muted}/></button>}
        <Svg name={open?'chevU':'chevD'} size={13} color={C.muted}/>
      </div>
      {open&&(
        <div style={{padding:'14px 16px'}}>
          {delivery.lines.length>0&&(
            <table style={{width:'100%',borderCollapse:'collapse',marginBottom:12}}>
              <thead><tr style={{background:C.s3}}>{['LINE','PART NUMBER','TARGET QTY','COO',''].map((h,i)=><th key={i} style={{padding:'6px 10px',textAlign:i===2?'center':'left',fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',borderBottom:`1px solid ${C.border}`}}>{h}</th>)}</tr></thead>
              <tbody>
                {delivery.lines.map((line,li)=>(
                  <tr key={line.id} style={{borderBottom:`1px solid ${C.border}`}}>
                    <td style={{padding:'8px 10px',fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}>{li+1}</td>
                    <td style={{padding:'8px 10px',fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:700,color:C.orange}}>{line.pn}</td>
                    <td style={{padding:'8px 10px',textAlign:'center',fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:800,color:C.text}}>{line.qty}</td>
                    <td style={{padding:'8px 10px',fontSize:12,color:C.sec}}>{line.coo}</td>
                    <td style={{padding:'8px 10px',textAlign:'right'}}><button onClick={()=>onChange({...delivery,lines:delivery.lines.filter(l=>l.id!==line.id)})} style={{background:'none',border:'none',cursor:'pointer',color:C.muted,padding:4,display:'inline-flex'}}><Svg name="trash" size={13} color={C.muted}/></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
          <div style={{display:'grid',gridTemplateColumns:'2fr 100px 110px auto',gap:8,alignItems:'end'}}>
            <div><label style={labelSx}>PART NUMBER *</label><input ref={pnRef} value={pn} onChange={e=>setPn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addLine()} placeholder="e.g. 0C19551" style={inputSx}/></div>
            <div><label style={labelSx}>TARGET QTY *</label><input value={qty} onChange={e=>setQty(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addLine()} type="number" min="1" placeholder="0" style={inputSx}/></div>
            <div><label style={labelSx}>COO</label><input value={coo} onChange={e=>setCoo(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addLine()} placeholder="CN / US / MX" style={inputSx}/></div>
            <button onClick={addLine} style={{height:38,padding:'0 14px',borderRadius:7,border:'none',background:C.orange,color:'#fff',cursor:'pointer',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:4}}><Svg name="plus" size={13} color="#fff"/>Add</button>
          </div>
          {err&&<div style={{color:C.red,fontSize:11,marginTop:5}}>{err}</div>}
        </div>
      )}
    </div>
  );
};

const SetupScreen = ({ onStart }) => {
  const [po,setPo]=useState('');
  const [deliveries,setDeliveries]=useState([{id:uid(),number:'',lines:[]}]);
  const [profile,setProfile]=useState({ po:false, delivery:false, pn:true, coo:true, qty:true });
  const update=(id,v)=>setDeliveries(p=>p.map(d=>d.id===id?v:d));
  const remove=(id)=>setDeliveries(p=>p.filter(d=>d.id!==id));
  const totalLines=deliveries.reduce((s,d)=>s+d.lines.length,0);
  const totalUnits=deliveries.reduce((s,d)=>s+d.lines.reduce((ss,l)=>ss+l.qty,0),0);
  const canStart=po.trim()&&deliveries.every(d=>d.number.trim())&&totalLines>0;
  const toggleField=(f)=>setProfile(p=>({...p,[f]:!p[f]}));
  const scannedList=FIELD_ORDER.filter(f=>profile[f]);
  const masterList=['delivery','pn','coo'].filter(f=>!profile[f]);
  return (
    <div style={{flex:1,overflowY:'auto',padding:'28px 0'}}>
      <div style={{maxWidth:840,margin:'0 auto',padding:'0 24px'}}>
        <div style={{marginBottom:24}}>
          <h1 style={{fontSize:22,fontWeight:800,color:C.text,letterSpacing:'-0.02em'}}>New Reconciliation Session</h1>
          <p style={{color:C.sec,fontSize:13,marginTop:4}}>Register packing-list targets. Each line is a target qty that may arrive split across one or more pallets.</p>
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:'16px 18px',marginBottom:16}}>
          <label style={labelSx}>PO NUMBER * <span style={{color:C.muted,fontWeight:500,letterSpacing:0}}>— one PO per session (master) · format VT9A00000####</span></label>
          <input value={po} onChange={e=>setPo(e.target.value.toUpperCase())} placeholder="e.g. VT9A000002123" style={{...inputSx,maxWidth:340}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em'}}>DELIVERIES → TARGET LINES</div>
          <button onClick={()=>setDeliveries(p=>[...p,{id:uid(),number:'',lines:[]}])} style={{display:'flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:6,border:`1px solid ${C.border}`,background:C.s2,color:C.sec,cursor:'pointer',fontSize:12,fontWeight:600}}><Svg name="plus" size={12} color={C.sec}/>Add Delivery</button>
        </div>
        {deliveries.map((del,i)=><DeliveryCard key={del.id} delivery={del} index={i} onChange={v=>update(del.id,v)} onRemove={()=>remove(del.id)} canRemove={deliveries.length>1}/>)}

        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:'18px',marginTop:16,marginBottom:16}}>
          <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:4}}>SCAN PROFILE — WHAT DO THE BOX BARCODES CONTAIN?</div>
          <p style={{fontSize:12,color:C.sec,marginBottom:14}}>Toggle the fields this vendor's boxes carry as barcodes. Fields left OFF are taken from the packing list (master) and never scanned. PN + COO + QTY is the common case.</p>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
            {FIELD_ORDER.map(f=>{
              const on=profile[f];
              return (
                <button key={f} onClick={()=>toggleField(f)} style={{display:'flex',alignItems:'center',gap:7,padding:'9px 14px',borderRadius:8,cursor:'pointer',border:`1.5px solid ${on?C.green:C.border}`,background:on?'rgba(35,197,94,.1)':C.s2,color:on?C.green:C.sec,fontSize:13,fontWeight:700,transition:'all .12s'}}>
                  <span style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${on?C.green:C.muted}`,background:on?C.green:'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>{on&&<Svg name="check" size={11} color="#0d0f14"/>}</span>
                  {FIELD_LABEL[f]}
                </button>
              );
            })}
          </div>
          <div style={{display:'flex',gap:14,flexWrap:'wrap',fontSize:12}}>
            <div style={{flex:1,minWidth:200,background:C.s2,borderRadius:8,padding:'10px 12px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:9,fontWeight:700,color:C.green,letterSpacing:'0.08em',marginBottom:6,display:'flex',alignItems:'center',gap:5}}><Svg name="scan" size={12} color={C.green}/>SCANNED PER BOX</div>
              <div style={{color:C.text,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>{scannedList.length?scannedList.map(f=>FIELD_SHORT[f]).join(' → '):'—'}</div>
            </div>
            <div style={{flex:1,minWidth:200,background:C.s2,borderRadius:8,padding:'10px 12px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:9,fontWeight:700,color:C.orange,letterSpacing:'0.08em',marginBottom:6,display:'flex',alignItems:'center',gap:5}}><Svg name="edit" size={11} color={C.orange}/>FROM PACKING LIST (MASTER)</div>
              <div style={{color:C.text,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>PO{masterList.length?', '+masterList.map(f=>FIELD_SHORT[f]).join(', '):''}</div>
            </div>
          </div>
          {(!profile.pn||!profile.coo)&&(<div style={{marginTop:12,fontSize:12,color:C.yellow,display:'flex',alignItems:'center',gap:6}}><Svg name="warn" size={13} color={C.yellow}/>PN or COO off the barcode → you'll select the active target manually before scanning each box.</div>)}
        </div>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontSize:12,color:C.muted}}>{totalLines} target line{totalLines!==1?'s':''} · {totalUnits} total pieces · {deliveries.length} delivery{deliveries.length!==1?'s':''}</div>
          <button onClick={()=>canStart&&onStart({po,deliveries,profile})} disabled={!canStart} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 24px',borderRadius:8,border:'none',background:canStart?C.orange:C.s3,color:canStart?'#fff':C.muted,cursor:canStart?'pointer':'not-allowed',fontSize:14,fontWeight:700}}>Start Reconciliation <Svg name="arrow" size={14} color={canStart?'#fff':C.muted}/></button>
        </div>
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════
   EDIT PALLET MODAL
═══════════════════════════════════════════ */
const EditPalletModal = ({ target, pallet, onSave, onDelete, onClose }) => {
  const [boxes,setBoxes] = useState(pallet.boxes.map(b=>({...b, qty:String(b.qty)})));
  const [sealed,setSealed] = useState(pallet.sealed);
  const [newQty,setNewQty] = useState('');
  const total = boxes.reduce((s,b)=>s+(parseInt(b.qty)||0),0);
  const setQty=(id,v)=>setBoxes(bs=>bs.map(b=>b.id===id?{...b,qty:v.replace(/\D/,'')}:b));
  const delBox=(id)=>setBoxes(bs=>bs.filter(b=>b.id!==id));
  const addBox=()=>{const q=parseInt(newQty);if(!q||q<1)return;setBoxes(bs=>[...bs,{id:uid(),qty:String(q),time:tsNow()}]);setNewQty('');};
  const save=()=>{ const clean=boxes.map(b=>({...b,qty:parseInt(b.qty)||0})).filter(b=>b.qty>0); onSave(clean,sealed); };
  const overTarget = total>target.targetQty;
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100}}>
      <div style={{width:440,maxHeight:'85vh',display:'flex',flexDirection:'column',background:C.surface,border:`2px solid ${C.orange}`,borderRadius:12,padding:22,animation:'pop-in .15s ease'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
          <PTag id={pallet.palletId} open={!sealed}/>
          <div style={{fontSize:15,fontWeight:800,color:C.text}}>Edit Pallet</div>
          <div style={{marginLeft:'auto',fontSize:12,color:C.sec}}><strong style={{color:C.orange,fontFamily:"'JetBrains Mono',monospace"}}>{target.pn}</strong> / {target.coo}</div>
        </div>
        <div style={{fontSize:11,color:C.muted,marginBottom:14}}>Correct box piece-counts, remove boxes, or add a missed one. Target {target.targetQty} pcs.</div>

        <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:6,marginBottom:12}}>
          {boxes.length===0&&<div style={{textAlign:'center',padding:'18px 0',color:C.muted,fontSize:12}}>No boxes on this pallet</div>}
          {boxes.map((b,i)=>(
            <div key={b.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:C.s2,border:`1px solid ${C.border}`,borderRadius:8}}>
              <span style={{fontSize:11,color:C.muted,fontWeight:600,minWidth:50}}>Box {String(i+1).padStart(2,'0')}</span>
              <input value={b.qty} onChange={e=>setQty(b.id,e.target.value)} type="number" min="1" style={{...inputSx,width:90,fontSize:15,fontWeight:800,padding:'6px 10px'}}/>
              <span style={{fontSize:11,color:C.muted}}>pcs</span>
              <button onClick={()=>delBox(b.id)} style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',padding:4,display:'flex'}}><Svg name="trash" size={14} color={C.muted}/></button>
            </div>
          ))}
        </div>

        {/* add box */}
        <div style={{display:'flex',gap:8,marginBottom:14}}>
          <input value={newQty} onChange={e=>setNewQty(e.target.value.replace(/\D/,''))} onKeyDown={e=>e.key==='Enter'&&addBox()} type="number" min="1" placeholder="Add box qty…" style={{...inputSx,flex:1}}/>
          <button onClick={addBox} style={{padding:'0 16px',borderRadius:7,border:`1px solid ${C.border}`,background:C.s2,color:C.sec,cursor:'pointer',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:5}}><Svg name="plus" size={13} color={C.sec}/>Add box</button>
        </div>

        {/* total + seal */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 12px',background:C.s3,borderRadius:8,marginBottom:14}}>
          <span style={{fontSize:12,color:C.sec,fontWeight:600}}>{boxes.length} boxes · pallet total</span>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:18,fontWeight:900,color:overTarget?C.yellow:C.text}}>{total} pcs</span>
        </div>
        <button onClick={()=>setSealed(s=>!s)} style={{width:'100%',padding:'8px 0',borderRadius:7,border:`1px solid ${sealed?C.green:C.border}`,background:sealed?'rgba(35,197,94,.1)':C.s2,color:sealed?C.green:C.sec,cursor:'pointer',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:6,marginBottom:14}}>
          <Svg name="seal" size={13} color={sealed?C.green:C.sec}/>{sealed?'SEALED — click to re-open':'OPEN — click to seal'}
        </button>

        <div style={{display:'flex',gap:10}}>
          <button onClick={onDelete} style={{padding:'10px 14px',borderRadius:8,border:`1px solid ${C.redDim}`,background:'transparent',color:C.red,fontSize:12,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:5}}><Svg name="trash" size={13} color={C.red}/>Delete pallet</button>
          <button onClick={onClose} style={{flex:1,padding:'10px 0',borderRadius:8,border:`1px solid ${C.border}`,background:'transparent',color:C.sec,fontSize:13,fontWeight:700,cursor:'pointer'}}>Cancel</button>
          <button onClick={save} style={{flex:1,padding:'10px 0',borderRadius:8,border:'none',background:C.orange,color:'#fff',fontSize:13,fontWeight:800,cursor:'pointer'}}>Save changes</button>
        </div>
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════
   SCAN SCREEN — targets split into 1+ pallets
═══════════════════════════════════════════ */
const ScanScreen = ({ session, onComplete }) => {
  const profile = session.profile;
  const buildTargets = () => session.deliveries.flatMap(del=>del.lines.map(line=>({
    id:line.id, delId:del.id, delNumber:del.number, pn:line.pn, coo:line.coo, targetQty:line.qty,
    pallets:[],
  })));
  const [targets,setTargets] = useState(buildTargets);
  const [activeDelId,setActiveDelId] = useState(session.deliveries[0]?.id||null);
  const [activeTargetId,setActiveTargetId] = useState(null);
  const [draft,setDraft] = useState({});
  const [stepIndex,setStepIndex] = useState(0);
  const [input,setInput] = useState('');
  const [confirm,setConfirm] = useState(null);
  const [editing,setEditing] = useState(null);
  const [lastBox,setLastBox] = useState(null);
  const [log,setLog] = useState([]);
  const [toasts,setToasts] = useState([]);
  const [flashKey,setFlashKey] = useState(0);
  const [flashType,setFlashType] = useState(null);
  const inputRef = useRef();

  const steps = FIELD_ORDER.filter(f => f==='qty' ? true : profile[f]);
  const needTargetSelect = !profile.pn || !profile.coo;
  const needDeliverySelect = !profile.delivery;

  const activeDel = session.deliveries.find(d=>d.id===activeDelId);
  const activeTarget = targets.find(t=>t.id===activeTargetId);

  const allComplete = targets.every(t=>targetTotal(t)>=t.targetQty);
  const completedCount = targets.filter(t=>targetTotal(t)>=t.targetQty).length;

  useEffect(()=>{ if(!confirm) inputRef.current?.focus(); },[stepIndex,confirm,activeTargetId,activeDelId]);

  const toast=(msg,type)=>{const id=Date.now();setToasts(p=>[{id,msg,type},...p].slice(0,2));setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),7000);};
  const flash=(type)=>{setFlashType(type);setFlashKey(k=>k+1);setTimeout(()=>setFlashType(null),700);};
  const resetDraft=()=>{setDraft({});setStepIndex(0);setInput('');setTimeout(()=>inputRef.current?.focus(),40);};

  const predictTarget = (d) => {
    const pn  = profile.pn  ? d.pn  : activeTarget?.pn;
    const coo = profile.coo ? d.coo : activeTarget?.coo;
    const del = profile.delivery ? d.delivery : activeDel?.number;
    if(!pn||!coo) return null;
    return targets.find(t=>t.delNumber===del&&t.pn===pn&&t.coo===coo) || null;
  };
  const predicted = predictTarget(draft);

  const commitBox = (targetId, qty, capturedDraft) => {
    let landedPallet=null, becameComplete=false, opened=false;
    setTargets(prev=>{
      const totalPalletsBefore = prev.reduce((s,t)=>s+t.pallets.length,0);
      return prev.map(t=>{
        if(t.id!==targetId) return t;
        let pallets = t.pallets.map(p=>({...p,boxes:[...p.boxes]}));
        let openIdx = pallets.findIndex(p=>!p.sealed);
        if(openIdx<0){ pallets.push({palletId:pId(totalPalletsBefore+1),boxes:[],sealed:false}); openIdx=pallets.length-1; opened=true; }
        pallets[openIdx] = {...pallets[openIdx], boxes:[...pallets[openIdx].boxes,{id:uid(),qty,time:tsNow(),data:capturedDraft}]};
        landedPallet = pallets[openIdx].palletId;
        const tot = pallets.reduce((s,p)=>s+p.boxes.reduce((ss,b)=>ss+b.qty,0),0);
        if(tot>=t.targetQty){ pallets[openIdx]={...pallets[openIdx],sealed:true}; becameComplete=true; }
        return {...t,pallets};
      });
    });
    flash('green');
    if(opened) toast(`Pallet ${landedPallet} opened`,'warn');
    setLastBox({palletId:landedPallet,qty,time:tsNow()});
    setLog(prev=>[{id:Date.now(),palletId:landedPallet,qty,time:tsNow(),complete:becameComplete},...prev].slice(0,80));
    resetDraft();
  };

  const openPalletAction = (targetId) => {
    setTargets(prev=>{
      const totalBefore=prev.reduce((s,t)=>s+t.pallets.length,0);
      return prev.map(t=>{
        if(t.id!==targetId||t.pallets.some(p=>!p.sealed)) return t;
        return {...t,pallets:[...t.pallets,{palletId:pId(totalBefore+1),boxes:[],sealed:false}]};
      });
    });
  };
  const savePallet = (targetId,palletId,boxes,sealed) => {
    setTargets(prev=>prev.map(t=> t.id!==targetId ? t : {...t,pallets:t.pallets.map(p=>p.palletId===palletId?{...p,boxes,sealed}:p)} ));
    setEditing(null);
  };
  const deletePallet = (targetId,palletId) => {
    setTargets(prev=>prev.map(t=> t.id!==targetId ? t : {...t,pallets:t.pallets.filter(p=>p.palletId!==palletId)} ));
    setEditing(null);
  };

  const sealAndNew = (targetId) => {
    setTargets(prev=>{
      const totalBefore = prev.reduce((s,t)=>s+t.pallets.length,0);
      return prev.map(t=>{
        if(t.id!==targetId) return t;
        const open=t.pallets.find(p=>!p.sealed);
        if(!open||open.boxes.length===0) return t;
        if(targetTotal(t)>=t.targetQty) return t; // already done
        const pallets=t.pallets.map(p=>p.sealed?p:{...p,sealed:true});
        pallets.push({palletId:pId(totalBefore+1),boxes:[],sealed:false});
        return {...t,pallets};
      });
    });
    toast('Pallet sealed — new pallet opened for this target','warn');
  };

  const finalize = (d) => {
    const po  = profile.po       ? d.po       : session.po;
    const del = profile.delivery ? d.delivery : activeDel?.number;
    const pn  = profile.pn       ? d.pn       : activeTarget?.pn;
    const coo = profile.coo      ? d.coo      : activeTarget?.coo;
    const qty = d.qty;
    const target = targets.find(t=>t.delNumber===del&&t.pn===pn&&t.coo===coo);
    if(!target){ toast(`NOT IN LIST — ${pn||'?'} / ${coo||'?'} not found in delivery ${del||'?'}`,'error'); flash('red'); resetDraft(); return; }
    const tot = targetTotal(target);
    const issues=[];
    if(profile.po && d.po!==session.po) issues.push(`PO mismatch — scanned ${d.po}, session is ${session.po}`);
    if(profile.delivery && !session.deliveries.find(x=>x.number===d.delivery)) issues.push(`Delivery ${d.delivery} is not in this packing list`);
    if(tot+qty>target.targetQty) issues.push(`OVER TARGET — adds ${qty} pcs, target ${target.pn}/${target.coo} expects ${target.targetQty} (now ${tot})`);
    if(issues.length){ flash('yellow'); setConfirm({issues,targetId:target.id,pn:target.pn,coo:target.coo,qty,draft:d}); return; }
    commitBox(target.id, qty, d);
  };

  const handleEnter = () => {
    if(confirm) return;
    const field = steps[stepIndex];
    let val = input.trim();
    if(field==='qty'){ const q=parseInt(val); if(!q||q<1){toast('Enter a valid piece quantity','error');return;} val=q; }
    else { if(!val) return; val=val.toUpperCase(); }
    const nd={...draft,[field]:val};
    setInput('');
    if(stepIndex<steps.length-1){ setDraft(nd); setStepIndex(stepIndex+1); }
    else { finalize(nd); }
  };

  const allPallets    = targets.flatMap(t=>realizedPallets(t));
  const totalExpected = targets.reduce((s,t)=>s+t.targetQty,0);
  const totalScanned  = targets.reduce((s,t)=>s+targetTotal(t),0);
  const totalBoxes    = targets.reduce((s,t)=>s+t.pallets.reduce((ss,p)=>ss+p.boxes.length,0),0);
  const overallPct    = targets.length?completedCount/targets.length*100:0;

  const currentField = steps[stepIndex];
  const isQtyStep = currentField==='qty';
  const blockedByTarget = needTargetSelect && !activeTarget;

  return (
    <div style={{flex:1,display:'flex',overflow:'hidden'}}>

      {/* LEFT — targets & their pallets */}
      <div style={{width:310,flexShrink:0,background:C.surface,borderRight:`1px solid ${C.border}`,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'12px 14px',borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
          <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:2}}>TARGETS — PO {session.po}</div>
          <div style={{fontSize:12,color:C.sec}}>{completedCount}/{targets.length} targets complete</div>
          <div style={{height:3,background:C.s3,borderRadius:2,marginTop:6}}><div style={{height:'100%',width:`${overallPct}%`,background:allComplete?C.green:C.orange,borderRadius:2,transition:'width .4s'}}/></div>
        </div>
        <div style={{flex:1,overflowY:'auto'}}>
          {session.deliveries.map(del=>{
            const dt=targets.filter(t=>t.delId===del.id);
            const dm=dt.filter(t=>targetTotal(t)>=t.targetQty).length;
            return (
              <div key={del.id}>
                <div style={{padding:'6px 14px',fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.07em',background:C.s2,borderBottom:`1px solid ${C.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",color:del.id===activeDelId?C.orange:C.sec,fontSize:10}}>{del.number}</span>
                  <span>{dm}/{dt.length}</span>
                </div>
                <div style={{padding:'8px 10px',display:'flex',flexDirection:'column',gap:8}}>
                  {dt.map(t=>{
                    const st=targetStatus(t); const tot=targetTotal(t);
                    const isPred=predicted?.id===t.id; const isSel=activeTargetId===t.id;
                    const pct=t.targetQty>0?Math.min(100,tot/t.targetQty*100):0;
                    const done=tot>=t.targetQty;
                    const rps=realizedPallets(t);
                    return (
                      <div key={t.id} onClick={()=>{ if(needTargetSelect){setActiveTargetId(t.id);setActiveDelId(t.delId);resetDraft();} }} style={{
                        background:(isPred||isSel)?C.s3:C.s2,border:`2px solid ${isSel?C.orange:isPred?C.green:done?'rgba(35,197,94,.4)':C.border}`,
                        borderRadius:8,padding:'9px 11px',transition:'all .15s',cursor:needTargetSelect?'pointer':'default'}}>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:800,color:C.orange}}>{t.pn}</span>
                          <Badge status={st}/>
                        </div>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
                          <span style={{fontSize:10,color:C.muted}}>COO: {t.coo}</span>
                          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:800}}>
                            <span style={{color:{matched:C.green,over:C.yellow,partial:C.blue,pending:C.text}[st]}}>{tot}</span><span style={{color:C.muted}}>/{t.targetQty}</span>
                          </span>
                        </div>
                        <div style={{height:2,background:C.s3,borderRadius:1,marginBottom:t.pallets.length?7:0}}><div style={{height:'100%',width:`${pct}%`,borderRadius:1,background:{matched:C.green,over:C.yellow,partial:C.blue,pending:C.border}[st],transition:'width .3s'}}/></div>
                        {/* pallets within target (all, incl. empty open) */}
                        {t.pallets.length>0&&(
                          <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:7}}>
                            {t.pallets.map(p=>(
                              <div key={p.palletId} style={{display:'flex',alignItems:'center',gap:6,fontSize:10}}>
                                <PTag id={p.palletId} open={!p.sealed}/>
                                <span style={{color:C.sec}}>{p.boxes.length} box{p.boxes.length!==1?'es':''}</span>
                                <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,color:C.text,marginLeft:'auto'}}>{palletPcs(p)} pcs</span>
                                <span style={{fontSize:8,fontWeight:700,letterSpacing:'0.06em',color:p.sealed?C.green:C.orange}}>{p.sealed?'SEALED':'OPEN'}</span>
                                <button onClick={(e)=>{e.stopPropagation();setEditing({targetId:t.id,palletId:p.palletId});}} title="Edit pallet" style={{background:'none',border:'none',cursor:'pointer',padding:2,display:'flex'}}><Svg name="edit" size={11} color={C.muted}/></button>
                              </div>
                            ))}
                          </div>
                        )}
                        {/* open pallet (explicit) */}
                        {!done&&!openPallet(t)&&(
                          <button onClick={(e)=>{e.stopPropagation();openPalletAction(t.id);}} style={{width:'100%',padding:'6px 0',borderRadius:6,border:`1px solid ${C.orange}`,background:'rgba(244,124,31,.1)',color:C.orange,cursor:'pointer',fontSize:10,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',gap:5}}>
                            <Svg name="box" size={11} color={C.orange}/>Open Pallet {String(t.pallets.length+1).padStart(2,'0')}
                          </button>
                        )}
                        {/* seal & new pallet */}
                        {!done&&openPallet(t)&&openPallet(t).boxes.length>0&&(
                          <button onClick={(e)=>{e.stopPropagation();sealAndNew(t.id);}} style={{width:'100%',padding:'5px 0',borderRadius:6,border:`1px solid ${C.border}`,background:C.s3,color:C.sec,cursor:'pointer',fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:5}}>
                            <Svg name="seal" size={11} color={C.sec}/>Seal pallet &amp; open new
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* CENTER — guided scanner */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',animation:flashType?`flash-${flashType} .6s ease forwards`:'none'}} key={`fl-${flashKey}`}>
        <div style={{padding:'12px 24px',borderBottom:`1px solid ${C.border}`,background:C.s2,flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:18,flexWrap:'wrap'}}>
            <div><div style={{fontSize:8,color:C.muted,letterSpacing:'0.08em'}}>PO (MASTER)</div><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:800,color:C.orange}}>{session.po}</div></div>
            <div style={{flex:1}}>
              <div style={{fontSize:8,color:C.muted,letterSpacing:'0.08em',marginBottom:4}}>{needDeliverySelect?'ACTIVE DELIVERY (scanning into)':'DELIVERY VIEW'}</div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {session.deliveries.map(d=>{
                  const dt=targets.filter(t=>t.delId===d.id); const done=dt.every(t=>targetTotal(t)>=t.targetQty);
                  return (<button key={d.id} onClick={()=>{setActiveDelId(d.id);setActiveTargetId(null);resetDraft();}} style={{padding:'4px 11px',borderRadius:5,fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",background:activeDelId===d.id?C.orange:'transparent',color:activeDelId===d.id?'#fff':done?C.green:C.sec,border:`1px solid ${activeDelId===d.id?C.orange:done?'rgba(35,197,94,.4)':C.border}`}}>{d.number}{done?' ✓':''}</button>);
                })}
              </div>
            </div>
          </div>
          {needTargetSelect&&(<div style={{marginTop:8,fontSize:11,color:activeTarget?C.green:C.yellow,display:'flex',alignItems:'center',gap:6}}>{activeTarget? <>Active target: <strong style={{color:C.text,fontFamily:"'JetBrains Mono',monospace"}}>{activeTarget.pn}</strong> / {activeTarget.coo}</> : <><Svg name="warn" size={12} color={C.yellow}/>Select the target you're receiving from the left list (PN/COO not on barcode).</>}</div>)}
        </div>

        {toasts.length>0&&(
          <div style={{padding:'10px 24px 0',flexShrink:0,display:'flex',flexDirection:'column',gap:5}}>
            {toasts.map(t=>(<div key={t.id} style={{display:'flex',alignItems:'center',gap:8,padding:'9px 13px',borderRadius:7,background:t.type==='error'?'#3b0f0f':'#3b2a0a',border:`1px solid ${t.type==='error'?C.red:C.yellow}`,color:t.type==='error'?'#fca5a5':'#fde68a',fontSize:13,fontWeight:600,animation:'slide-in .2s ease'}}><Svg name="warn" size={14} color={t.type==='error'?C.red:C.yellow}/>{t.msg}</div>))}
          </div>
        )}

        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'20px 32px',overflowY:'auto'}}>
          {allComplete ? (
            <div style={{textAlign:'center'}}>
              <div style={{width:64,height:64,borderRadius:'50%',background:C.green,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}><Svg name="check" size={32} color="#fff"/></div>
              <div style={{fontSize:20,fontWeight:800,color:C.text,marginBottom:6}}>All targets reached 100%</div>
              <div style={{fontSize:13,color:C.sec,marginBottom:20}}>{allPallets.length} pallets · {totalBoxes} boxes · {totalScanned} pieces reconciled. Ready for WMS entry.</div>
              <button onClick={()=>onComplete({targets})} style={{padding:'12px 28px',borderRadius:8,border:'none',background:C.green,color:'#fff',fontSize:15,fontWeight:800,cursor:'pointer'}}>✓ Complete &amp; Print Labels</button>
            </div>
          ) : (
            <div style={{width:'100%',maxWidth:520}}>
              {lastBox&&(<div style={{textAlign:'center',marginBottom:18,padding:'10px 16px',borderRadius:10,background:'rgba(35,197,94,.07)',border:`1px solid ${C.green}`,animation:'pop-in .15s ease'}}><span style={{fontSize:12,color:C.sec}}>Last box → </span><PTag id={lastBox.palletId}/><span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:900,fontSize:16,color:C.green,marginLeft:8}}>+{lastBox.qty} pcs</span></div>)}

              <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:16,flexWrap:'wrap'}}>
                {steps.map((f,i)=>{
                  const captured=draft[f]!==undefined; const active=i===stepIndex&&!blockedByTarget;
                  return (<div key={f} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,minWidth:74,padding:'8px 10px',borderRadius:8,background:active?C.s3:C.surface,border:`1.5px solid ${active?C.orange:captured?C.green:C.border}`}}><span style={{fontSize:8,fontWeight:700,letterSpacing:'0.08em',color:active?C.orange:captured?C.green:C.muted}}>{FIELD_SHORT[f]}</span><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:800,color:captured?C.text:C.muted}}>{captured?draft[f]:(active?'…':'—')}</span></div>);
                })}
              </div>

              {predicted&&(<div style={{textAlign:'center',marginBottom:12,fontSize:12,color:C.sec}}>→ target <strong style={{color:C.text,fontFamily:"'JetBrains Mono',monospace"}}>{predicted.pn}</strong>/{predicted.coo} <span style={{color:C.muted}}>({targetTotal(predicted)}/{predicted.targetQty})</span> · pallet <PTag id={openPallet(predicted)?.palletId||'—'} open/></div>)}

              <div style={{marginBottom:8}}>
                <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:'0.07em',marginBottom:8,display:'flex',alignItems:'center',gap:6,justifyContent:'center'}}>
                  <span style={{display:'inline-block',width:7,height:7,borderRadius:'50%',background:blockedByTarget?C.yellow:C.green,animation:blockedByTarget?'none':'pulse-dot 2s infinite'}}/>
                  {blockedByTarget?'SELECT A TARGET FIRST':`${isQtyStep&&!profile.qty?'TYPE':'SCAN'} ${FIELD_LABEL[currentField]}`}
                </div>
                <div style={{position:'relative'}}>
                  <input ref={inputRef} value={input} disabled={blockedByTarget} onChange={e=>setInput(isQtyStep?e.target.value.replace(/\D/,''):e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleEnter()} type={isQtyStep?'number':'text'} min={isQtyStep?'1':undefined} placeholder={blockedByTarget?'Target required…':isQtyStep?'Pieces in this box…':`Scan ${FIELD_SHORT[currentField]} barcode…`} autoFocus style={{...inputSx,fontSize:20,fontWeight:800,padding:'13px 48px 13px 16px',height:56,border:`2px solid ${blockedByTarget?C.border:C.orange}`,borderRadius:10,opacity:blockedByTarget?.5:1}}/>
                  <div style={{position:'absolute',right:14,top:'50%',transform:'translateY(-50%)'}}><Svg name="scan" size={20} color={C.orange}/></div>
                </div>
                <div style={{fontSize:11,color:C.muted,marginTop:6,textAlign:'center'}}>Step {stepIndex+1} of {steps.length} · {steps.map(f=>FIELD_SHORT[f]).join(' → ')} · Enter to confirm{stepIndex>0&&<button onClick={resetDraft} style={{marginLeft:10,background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:11,textDecoration:'underline'}}>reset box</button>}</div>
              </div>

              <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:18,flexWrap:'wrap'}}>
                {[['TARGETS',`${completedCount}/${targets.length}`,C.green],['EXPECTED',totalExpected,C.sec],['COUNTED',totalScanned,C.text],['PALLETS',allPallets.length,C.text],['BOXES',totalBoxes,C.text]].map(([l,v,c])=>(<div key={l} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:'9px 14px',textAlign:'center',minWidth:72}}><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:18,fontWeight:900,color:c}}>{v}</div><div style={{fontSize:9,color:C.muted,letterSpacing:'0.07em',marginTop:2}}>{l}</div></div>))}
              </div>
            </div>
          )}
        </div>

        {log.length>0&&!allComplete&&(
          <div style={{height:120,borderTop:`1px solid ${C.border}`,background:C.surface,padding:'9px 24px',overflowY:'auto',flexShrink:0}}>
            <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:6}}>BOX LOG</div>
            {log.map(e=>(<div key={e.id} style={{display:'flex',alignItems:'center',gap:10,fontSize:11,marginBottom:3}}><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:C.muted,minWidth:60}}>{e.time}</span><PTag id={e.palletId}/><span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,color:C.text}}>+{e.qty} pcs</span>{e.complete&&<span style={{color:C.green,fontSize:10,fontWeight:700}}>✓ target complete</span>}</div>))}
          </div>
        )}
      </div>

      {/* RIGHT — totals */}
      <div style={{width:200,flexShrink:0,background:C.surface,borderLeft:`1px solid ${C.border}`,padding:14,display:'flex',flexDirection:'column',gap:12,overflowY:'auto'}}>
        <div style={{textAlign:'center',paddingTop:4}}>
          <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:10}}>OVERALL</div>
          <svg width={90} height={90} style={{display:'block',margin:'0 auto'}}>
            <circle cx={45} cy={45} r={34} fill="none" stroke={C.s3} strokeWidth={7}/>
            <circle cx={45} cy={45} r={34} fill="none" stroke={allComplete?C.green:C.orange} strokeWidth={7} strokeDasharray={`${2*Math.PI*34}`} strokeDashoffset={`${2*Math.PI*34*(1-overallPct/100)}`} strokeLinecap="round" transform="rotate(-90 45 45)" style={{transition:'stroke-dashoffset .5s ease'}}/>
            <text x={45} y={42} textAnchor="middle" fill={C.text} fontSize={16} fontWeight={900} fontFamily="'Inter',sans-serif">{Math.round(overallPct)}%</text>
            <text x={45} y={55} textAnchor="middle" fill={C.muted} fontSize={8} fontFamily="'Inter',sans-serif" letterSpacing={1}>DONE</text>
          </svg>
        </div>
        <div style={{borderTop:`1px solid ${C.border}`,paddingTop:12}}>
          <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:8}}>SHIPMENT TOTALS</div>
          {[['PO',session.po],['Targets',`${completedCount}/${targets.length}`],['Expected pcs',totalExpected],['Counted pcs',totalScanned],['Pallets',allPallets.length],['Boxes',totalBoxes]].map(([k,v])=>(<div key={k} style={{display:'flex',justifyContent:'space-between',marginBottom:7,gap:6}}><span style={{fontSize:11,color:C.muted}}>{k}</span><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:700,color:C.text,textAlign:'right',wordBreak:'break-all'}}>{v}</span></div>))}
        </div>
        <div style={{borderTop:`1px solid ${C.border}`,paddingTop:12}}>
          <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:8}}>SCAN PROFILE</div>
          <div style={{fontSize:10,color:C.sec,marginBottom:4}}><span style={{color:C.green,fontWeight:700}}>Scanned:</span> {steps.map(f=>FIELD_SHORT[f]).join(' → ')}</div>
          <div style={{fontSize:10,color:C.sec}}><span style={{color:C.orange,fontWeight:700}}>Master:</span> PO{['delivery','pn','coo'].filter(f=>!profile[f]).length?', '+['delivery','pn','coo'].filter(f=>!profile[f]).map(f=>FIELD_SHORT[f]).join(', '):''}</div>
        </div>
        <div style={{marginTop:'auto',paddingTop:12}}>
          {allComplete?(<button onClick={()=>onComplete({targets})} style={{width:'100%',padding:'11px 0',borderRadius:8,border:'none',background:C.green,color:'#fff',fontSize:13,fontWeight:800,cursor:'pointer'}}>✓ Complete &amp; Print</button>)
            :(<div style={{padding:'10px',background:C.s2,borderRadius:8,border:`1px solid ${C.border}`,fontSize:11,color:C.muted,textAlign:'center',lineHeight:1.5}}><span style={{color:C.yellow,fontWeight:700}}>100% required</span><br/>No partial shipments</div>)}
        </div>
      </div>

      {editing&&(()=>{ const t=targets.find(x=>x.id===editing.targetId); const p=t?.pallets.find(x=>x.palletId===editing.palletId); if(!t||!p) return null; return (
        <EditPalletModal target={t} pallet={p} onClose={()=>setEditing(null)} onSave={(boxes,sealed)=>savePallet(t.id,p.palletId,boxes,sealed)} onDelete={()=>deletePallet(t.id,p.palletId)}/>
      ); })()}

      {confirm&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100}}>
          <div style={{width:440,background:C.surface,border:`2px solid ${C.yellow}`,borderRadius:12,padding:24,animation:'pop-in .15s ease'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}><div style={{width:32,height:32,borderRadius:'50%',background:C.yellowDim,display:'flex',alignItems:'center',justifyContent:'center'}}><Svg name="warn" size={17} color={C.yellow}/></div><div style={{fontSize:15,fontWeight:800,color:C.text}}>Discrepancy — confirm to register</div></div>
            <div style={{fontSize:12,color:C.sec,marginBottom:6}}>Box → target <strong style={{color:C.text,fontFamily:"'JetBrains Mono',monospace"}}>{confirm.pn}</strong> / {confirm.coo} · <strong style={{color:C.text}}>{confirm.qty} pcs</strong></div>
            <ul style={{margin:'10px 0 18px',padding:'12px 14px',background:C.yellowDim,borderRadius:8,listStyle:'none'}}>{confirm.issues.map((iss,i)=>(<li key={i} style={{fontSize:12,color:'#fde68a',marginBottom:i<confirm.issues.length-1?6:0,display:'flex',gap:7}}><span>⚠</span>{iss}</li>))}</ul>
            <div style={{display:'flex',gap:10}}><button onClick={()=>{setConfirm(null);resetDraft();}} style={{flex:1,padding:'10px 0',borderRadius:8,border:`1px solid ${C.border}`,background:'transparent',color:C.sec,fontSize:13,fontWeight:700,cursor:'pointer'}}>Cancel</button><button onClick={()=>{const c=confirm;setConfirm(null);commitBox(c.targetId,c.qty,c.draft);}} style={{flex:1,padding:'10px 0',borderRadius:8,border:'none',background:C.yellow,color:'#1a1205',fontSize:13,fontWeight:800,cursor:'pointer'}}>Confirm &amp; Register</button></div>
          </div>
        </div>
      )}
    </div>
  );
};

                    </table>

              })}
            </div>
          </div>
        ))}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:'14px 18px',display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,color:C.sec}}>SHIPMENT GRAND TOTAL — PO {session.po}</div>
          <div style={{display:'flex',gap:24}}>{[[targets.length,'TARGETS'],[totalPallets,'PALLETS'],[totalBoxes,'BOXES'],[totalPcs,'PIECES']].map(([v,l])=>(<div key={l} style={{textAlign:'center'}}><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:22,fontWeight:900,color:C.green}}>{v}</div><div style={{fontSize:9,color:C.muted,letterSpacing:'0.07em'}}>{l}</div></div>))}</div>
        </div>
        <div style={{padding:'12px 16px',borderRadius:8,fontSize:12,color:C.sec,background:C.surface,border:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:10}}><Svg name="print" size={14} color={C.muted}/><span>Each target may span several pallets. Pallet label: <strong style={{color:C.text}}>12.8 × 6.3 cm</strong> with box breakdown and "Pallet X of Y" · Summary lists every pallet. Both for Zebra ZT Industrial.</span></div>
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════
   HEADER + APP
═══════════════════════════════════════════ */
const Header = ({ screen, session, onReset }) => (
  <header style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 20px',height:52,background:C.surface,borderBottom:`1px solid ${C.border}`,flexShrink:0,zIndex:50}}>
    <div style={{display:'flex',alignItems:'center',gap:14}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <div style={{width:30,height:30,borderRadius:6,background:C.orange,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><svg width="16" height="16" viewBox="0 0 16 16" fill="white"><polygon points="1,8 8,1 15,8 8,8"/><polygon points="8,8 15,8 8,15" opacity=".6"/></svg></div>
        <div><div style={{fontSize:12,fontWeight:800,color:C.text,letterSpacing:'0.04em',lineHeight:1.2}}>ARROW ELECTRONICS</div><div style={{fontSize:9,color:C.muted,letterSpacing:'0.06em'}}>MICROSOFT · SEVENUM</div></div>
      </div>
      <div style={{width:1,height:28,background:C.border}}/>
      <div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:7,height:7,borderRadius:'50%',background:{setup:C.yellow,scan:C.green,summary:C.sec}[screen],animation:screen==='scan'?'pulse-dot 2s infinite':'none'}}/><span style={{fontSize:10,fontWeight:700,color:C.sec,letterSpacing:'0.06em'}}>{{setup:'SETUP',scan:'RECONCILIATION ACTIVE',summary:'SESSION COMPLETE'}[screen]}</span></div>
    </div>
    <div style={{display:'flex',alignItems:'center',gap:18}}>
      {session?.po&&<div style={{textAlign:'right'}}><div style={{fontSize:9,color:C.muted,letterSpacing:'0.07em'}}>PO</div><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:700,color:C.orange}}>{session.po}</div></div>}
      {session?.deliveries&&<div style={{textAlign:'right'}}><div style={{fontSize:9,color:C.muted,letterSpacing:'0.07em'}}>DELIVERIES</div><div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:700,color:C.text}}>{session.deliveries.length}</div></div>}
      {screen!=='setup'&&<button onClick={onReset} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',borderRadius:6,border:`1px solid ${C.border}`,background:'transparent',color:C.sec,cursor:'pointer',fontSize:12,fontWeight:600}}><Svg name="reset" size={12} color={C.sec}/>New Session</button>}
    </div>
  </header>
);

const App = () => {
  const [screen,setScreen]=useState('setup');
  const [session,setSession]=useState(null);
  const [results,setResults]=useState(null);
  useEffect(()=>{try{const s=JSON.parse(localStorage.getItem('pm6')||'null');if(s?.screen&&s?.session){setScreen(s.screen);setSession(s.session);if(s.results)setResults(s.results);}}catch(_){}; },[]);
  useEffect(()=>{try{localStorage.setItem('pm6',JSON.stringify({screen,session,results}));}catch(_){}; },[screen,session,results]);
  const reset=()=>{setSession(null);setResults(null);setScreen('setup');localStorage.removeItem('pm6');};
  return (
    <div style={{height:'100%',display:'flex',flexDirection:'column'}}>
      <style>{`input:focus{outline:2px solid ${C.orange}!important;outline-offset:0;}button:hover{opacity:.92;}`}</style>
      <Header screen={screen} session={session} onReset={reset}/>
      {screen==='setup'   && <SetupScreen onStart={s=>{setSession(s);setScreen('scan');}}/>}
      {screen==='scan'    && <ScanScreen session={session} onComplete={r=>{setResults(r);setScreen('summary');}}/>}
      {screen==='summary' && <SummaryScreen session={session} results={results} onNew={reset}/>}
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
