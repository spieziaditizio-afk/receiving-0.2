<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PackCalc — Smart Receiving Calculator | Arrow Electronics</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body,#root{height:100%;}
    body{background:#0d0f14;color:#e3e5ef;font-family:'Inter',system-ui,sans-serif;overflow:hidden;}
    input,button{font-family:inherit;}
    ::-webkit-scrollbar{width:6px;}
    ::-webkit-scrollbar-track{background:#141720;}
    ::-webkit-scrollbar-thumb{background:#2c3047;border-radius:3px;}
    @keyframes pulse-dot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(35,197,94,.4);}50%{opacity:.6;box-shadow:0 0 0 6px rgba(35,197,94,0);}}
    @keyframes flash-green{0%{background:rgba(35,197,94,.16);}100%{background:transparent;}}
    @keyframes pop-in{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:none;}}
    @keyframes slide-in{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:none;}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const C = {
  bg:'#0d0f14', surface:'#141720', s2:'#1b1f2c', s3:'#232839',
  border:'#2c3047', text:'#e3e5ef', sec:'#8890a8', muted:'#565e7a',
  orange:'#f47c1f', green:'#23c55e', greenDim:'#14532d',
  red:'#ef4444', yellow:'#f59e0b', blue:'#3b82f6',
};
const PATHS = {
  check:'M20 6 9 17l-5-5', xmark:'M18 6 6 18M6 6l12 12', plus:'M12 5v14M5 12h14',
  trash:'M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6',
  print:'M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z',
  reset:'M1 4v6h6M3.51 15a9 9 0 1 0 .49-4.34', scan:'M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10',
  box:'M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z',
  edit:'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z',
};
const Svg = ({ name, size=16, color='currentColor' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {(PATHS[name]||'').split(/(?=[ML])/).map((seg,i)=><path key={i} d={seg.trim()}/>)}
  </svg>
);
const inputSx = { width:'100%', padding:'9px 12px', borderRadius:7, background:C.s2, border:`1px solid ${C.border}`, color:C.text, fontSize:13, fontFamily:"'JetBrains Mono',monospace", outline:'none' };
const labelSx = { display:'block', fontSize:9, fontWeight:700, color:C.muted, letterSpacing:'0.08em', marginBottom:4 };
const uid = () => Math.random().toString(36).slice(2,9);
const tsNow = () => new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const dateStr = () => new Date().toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});

/* ═══════════════════════════════════════════
   TICKET PRINT
═══════════════════════════════════════════ */
const printTicket = (meta, boxes) => {
  const ts = dateStr();
  const totalPcs = boxes.reduce((s,b)=>s+b.qty,0);
  const boxRows = boxes.map((b,i)=>`<div class="box-row"><span class="bnum">Box ${String(i+1).padStart(2,'0')}</span>${b.pn?`<span class="bpn">${b.pn}</span>`:''}${b.coo?`<span class="bcoo">${b.coo}</span>`:''}<span class="bqty">${b.qty}</span><span class="bunit">pcs</span></div>`).join('');
  const showCols = boxes.some(b=>b.pn)||boxes.some(b=>b.coo);
  const w = window.open('','_blank','width=620,height=560,toolbar=0,menubar=0');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Receiving Ticket${meta.pn?` — ${meta.pn}`:''}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#f0f0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif;gap:14px;padding:20px;}
    .label{width:12.8cm;background:#fff;border:1.5px solid #111;padding:9px 12px;display:flex;flex-direction:column;gap:6px;}
    .hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:5px;}
    .brand{font-size:10px;font-weight:900;letter-spacing:.06em;}
    .tag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:900;padding:2px 8px;border-radius:3px;background:rgba(244,124,31,.12);color:#a8480a;border:1px solid rgba(244,124,31,.4);}
    .pn{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:900;color:#111;letter-spacing:.02em;}
    .meta{display:flex;gap:18px;border-top:1px solid #ddd;padding-top:5px;}
    .mf .lbl{font-size:7px;font-weight:700;letter-spacing:.1em;color:#888;} .mf .val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;color:#111;}
    .boxes-sec{border-top:1px solid #ddd;padding-top:5px;}
    .boxes-title{font-size:7.5px;font-weight:700;letter-spacing:.1em;color:#888;margin-bottom:4px;}
    .box-row{display:flex;align-items:center;gap:8px;padding:2px 6px;border-bottom:1px solid #f0f0f0;}
    .bnum{font-size:8px;color:#888;font-weight:700;min-width:42px;}
    .bpn{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;color:#a8480a;min-width:70px;}
    .bcoo{font-size:9px;color:#555;min-width:28px;}
    .bqty{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:900;color:#111;margin-left:auto;} .bunit{font-size:8px;color:#888;}
    .boxes-grid{display:grid;grid-template-columns:repeat(${showCols?2:4},1fr);gap:2px;}
    .totals{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-top:1px solid #ddd;padding-top:5px;}
    .tot-block{background:#f7f7f7;border-radius:3px;padding:4px 8px;}
    .tot-lbl{font-size:7px;font-weight:700;letter-spacing:.1em;color:#888;} .tot-val{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:900;color:#111;}
    .ftr{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ddd;padding-top:5px;}
    .ft{font-size:8px;color:#999;} .ok{padding:2px 8px;border-radius:3px;font-size:9px;font-weight:800;background:#14532d;color:#22c55e;}
    .btn{padding:9px 24px;border:none;border-radius:6px;background:#f47c1f;color:#fff;font-weight:800;font-size:13px;cursor:pointer;}
    @media print{body{background:#fff;}button{display:none!important;}}
  </style></head><body>
  <div class="label">
    <div class="hdr"><div class="brand"><span style="color:#f47c1f;">ARROW</span> ELECTRONICS — MICROSOFT DEPT</div><div class="tag">RECEIVING</div></div>
    ${meta.pn?`<div class="pn">${meta.pn}</div>`:'<div class="pn" style="color:#aaa;font-size:16px;">— mixed / no PN —</div>'}
    <div class="meta">
      ${meta.coo?`<div class="mf"><div class="lbl">COO</div><div class="val">${meta.coo}</div></div>`:''}
      ${meta.po?`<div class="mf"><div class="lbl">PO</div><div class="val">${meta.po}</div></div>`:''}
      ${meta.ref?`<div class="mf"><div class="lbl">REF</div><div class="val">${meta.ref}</div></div>`:''}
    </div>
    <div class="boxes-sec"><div class="boxes-title">BOX BREAKDOWN — PIECES PER BOX</div><div class="boxes-grid">${boxRows}</div></div>
    <div class="totals"><div class="tot-block"><div class="tot-lbl">TOTAL BOXES</div><div class="tot-val">${boxes.length}</div></div><div class="tot-block"><div class="tot-lbl">TOTAL PIECES</div><div class="tot-val">${totalPcs}</div></div></div>
    <div class="ftr"><span class="ft">SEVENUM · ${ts}</span><span class="ok">✓ COUNTED</span></div>
  </div>
  <button class="btn" onclick="window.print()">🖨 &nbsp;Print on Zebra ZT</button>
  </body></html>`);
  w.document.close();
};

/* ═══════════════════════════════════════════
   APP
═══════════════════════════════════════════ */
const FIELDS = [
  { key:'pn',  label:'PART NUMBER', short:'PN',  optional:true },
  { key:'coo', label:'COUNTRY OF ORIGIN', short:'COO', optional:true },
  { key:'qty', label:'PIECE QTY', short:'QTY', optional:false },
];

const App = () => {
  const [cfg,setCfg] = useState({ pn:true, coo:true });   // which optional fields to capture
  const [meta,setMeta] = useState({ pn:'', coo:'', po:'', ref:'' });
  const [boxes,setBoxes] = useState([]);
  const [draft,setDraft] = useState({});
  const [stepIndex,setStepIndex] = useState(0);
  const [input,setInput] = useState('');
  const [editingId,setEditingId] = useState(null);
  const [flashKey,setFlashKey] = useState(0);
  const [flash,setFlash] = useState(false);
  const inputRef = useRef();

  // persist
  useEffect(()=>{try{const s=JSON.parse(localStorage.getItem('packcalc')||'null');if(s){setCfg(s.cfg||{pn:true,coo:true});setMeta(s.meta||{pn:'',coo:'',po:'',ref:''});setBoxes(s.boxes||[]);}}catch(_){}; },[]);
  useEffect(()=>{try{localStorage.setItem('packcalc',JSON.stringify({cfg,meta,boxes}));}catch(_){}; },[cfg,meta,boxes]);

  const steps = FIELDS.filter(f=>!f.optional||cfg[f.key]);
  const currentField = steps[stepIndex];
  const isQty = currentField?.key==='qty';

  useEffect(()=>{ inputRef.current?.focus(); },[stepIndex,editingId]);
  const doFlash = ()=>{ setFlash(true); setFlashKey(k=>k+1); setTimeout(()=>setFlash(false),700); };
  const resetDraft = ()=>{ setDraft({}); setStepIndex(0); setInput(''); setTimeout(()=>inputRef.current?.focus(),40); };

  const commit = (nd) => {
    const box = { id:uid(), pn:nd.pn?nd.pn.toUpperCase():(cfg.pn?'':''), coo:nd.coo?nd.coo.toUpperCase():'', qty:nd.qty, time:tsNow() };
    setBoxes(p=>[...p, box]);
    doFlash();
    resetDraft();
  };

  const handleEnter = () => {
    const f = currentField;
    let val = input.trim();
    if(f.key==='qty'){ const q=parseInt(val); if(!q||q<1) return; val=q; }
    else { val = val.toUpperCase(); } // optional fields may be blank
    const nd = {...draft,[f.key]:val};
    setInput('');
    if(stepIndex<steps.length-1){ setDraft(nd); setStepIndex(stepIndex+1); }
    else commit(nd);
  };
  const skipField = () => {
    const nd = {...draft,[currentField.key]:''};
    setInput('');
    if(stepIndex<steps.length-1){ setDraft(nd); setStepIndex(stepIndex+1); }
    else commit(nd);
  };

  const delBox = (id)=>setBoxes(p=>p.filter(b=>b.id!==id));
  const editBox = (id,patch)=>setBoxes(p=>p.map(b=>b.id===id?{...b,...patch}:b));

  const totalPcs = boxes.reduce((s,b)=>s+b.qty,0);
  const avgPcs   = boxes.length?Math.round(totalPcs/boxes.length):0;
  const distinctPn = [...new Set(boxes.filter(b=>b.pn).map(b=>b.pn))];
  const distinctCoo = [...new Set(boxes.filter(b=>b.coo).map(b=>b.coo))];

  const clearAll = ()=>{ if(confirm('Clear all boxes and start a new pallet?')){ setBoxes([]); setMeta({pn:'',coo:'',po:'',ref:''}); resetDraft(); } };

  return (
    <div style={{height:'100%',display:'flex',flexDirection:'column'}}>
      <style>{`input:focus{outline:2px solid ${C.orange}!important;outline-offset:0;}button:hover{opacity:.92;}`}</style>

      {/* HEADER */}
      <header style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 20px',height:52,background:C.surface,borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:30,height:30,borderRadius:6,background:C.orange,display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="16" height="16" viewBox="0 0 16 16" fill="white"><polygon points="1,8 8,1 15,8 8,8"/><polygon points="8,8 15,8 8,15" opacity=".6"/></svg></div>
          <div>
            <div style={{fontSize:13,fontWeight:800,color:C.text,letterSpacing:'0.01em',lineHeight:1.15}}>PackCalc <span style={{color:C.muted,fontWeight:600}}>— Smart Receiving Calculator</span></div>
            <div style={{fontSize:9,color:C.muted,letterSpacing:'0.06em'}}>ARROW ELECTRONICS · MICROSOFT · SEVENUM</div>
          </div>
        </div>
        <button onClick={clearAll} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',borderRadius:6,border:`1px solid ${C.border}`,background:'transparent',color:C.sec,cursor:'pointer',fontSize:12,fontWeight:600}}><Svg name="reset" size={12} color={C.sec}/>New Pallet</button>
      </header>

      <div style={{flex:1,display:'flex',overflow:'hidden'}}>

        {/* LEFT — scanner + config */}
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',animation:flash?'flash-green .6s ease forwards':'none'}} key={`fl-${flashKey}`}>
          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px 32px',overflowY:'auto'}}>
            <div style={{width:'100%',maxWidth:480}}>

              {/* capture config */}
              <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:22}}>
                <span style={{fontSize:11,color:C.muted,alignSelf:'center',marginRight:4}}>Scan per box:</span>
                {FIELDS.map(f=>{
                  const on = f.optional ? cfg[f.key] : true;
                  return (
                    <button key={f.key} onClick={()=>f.optional&&setCfg(c=>({...c,[f.key]:!c[f.key]}))} disabled={!f.optional} style={{
                      display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:7,cursor:f.optional?'pointer':'default',
                      border:`1.5px solid ${on?C.green:C.border}`,background:on?'rgba(35,197,94,.1)':C.s2,color:on?C.green:C.sec,fontSize:12,fontWeight:700,opacity:f.optional?1:.85}}>
                      <span style={{width:14,height:14,borderRadius:4,border:`1.5px solid ${on?C.green:C.muted}`,background:on?C.green:'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>{on&&<Svg name="check" size={10} color="#0d0f14"/>}</span>
                      {f.label}{!f.optional&&<span style={{fontSize:8,color:C.muted,fontWeight:600}}>req</span>}
                    </button>
                  );
                })}
              </div>

              {/* step chips */}
              <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:18,flexWrap:'wrap'}}>
                {steps.map((f,i)=>{
                  const captured=draft[f.key]!==undefined; const active=i===stepIndex;
                  return (<div key={f.key} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,minWidth:90,padding:'9px 12px',borderRadius:8,background:active?C.s3:C.surface,border:`1.5px solid ${active?C.orange:captured?C.green:C.border}`}}>
                    <span style={{fontSize:8,fontWeight:700,letterSpacing:'0.08em',color:active?C.orange:captured?C.green:C.muted}}>{f.short}</span>
                    <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:800,color:captured?C.text:C.muted}}>{captured?(draft[f.key]||'—'):(active?'…':'—')}</span>
                  </div>);
                })}
              </div>

              {/* input */}
              <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:'0.07em',marginBottom:8,display:'flex',alignItems:'center',gap:6,justifyContent:'center'}}>
                <span style={{display:'inline-block',width:7,height:7,borderRadius:'50%',background:C.green,animation:'pulse-dot 2s infinite'}}/>
                {isQty?'TYPE OR SCAN':'SCAN'} {currentField.label}{currentField.optional?' (optional)':''}
              </div>
              <div style={{position:'relative'}}>
                <input ref={inputRef} value={input} onChange={e=>setInput(isQty?e.target.value.replace(/\D/,''):e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleEnter()} type={isQty?'number':'text'} min={isQty?'1':undefined} placeholder={isQty?'Pieces in this box…':`Scan ${currentField.short} barcode…`} autoFocus style={{...inputSx,fontSize:21,fontWeight:800,padding:'14px 50px 14px 16px',height:58,border:`2px solid ${C.orange}`,borderRadius:10}}/>
                <div style={{position:'absolute',right:15,top:'50%',transform:'translateY(-50%)'}}><Svg name="scan" size={21} color={C.orange}/></div>
              </div>
              <div style={{fontSize:11,color:C.muted,marginTop:7,textAlign:'center'}}>
                Step {stepIndex+1} of {steps.length} · {steps.map(f=>f.short).join(' → ')} · Enter to confirm
                {currentField.optional&&<button onClick={skipField} style={{marginLeft:10,background:'none',border:'none',color:C.blue,cursor:'pointer',fontSize:11,fontWeight:600,textDecoration:'underline'}}>skip {currentField.short}</button>}
                {stepIndex>0&&<button onClick={resetDraft} style={{marginLeft:10,background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:11,textDecoration:'underline'}}>reset box</button>}
              </div>

              {/* live totals */}
              <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:26,flexWrap:'wrap'}}>
                {[['BOXES',boxes.length,C.text],['TOTAL PCS',totalPcs,C.green],['AVG / BOX',avgPcs,C.sec]].map(([l,v,c])=>(
                  <div key={l} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:9,padding:'12px 22px',textAlign:'center',minWidth:96}}>
                    <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:26,fontWeight:900,color:c}}>{v}</div>
                    <div style={{fontSize:9,color:C.muted,letterSpacing:'0.07em',marginTop:2}}>{l}</div>
                  </div>
                ))}
              </div>
              {(distinctPn.length>1||distinctCoo.length>1)&&(
                <div style={{marginTop:14,textAlign:'center',fontSize:11,color:C.yellow}}>
                  ⚠ Mixed pallet — {distinctPn.length>1?`${distinctPn.length} part numbers`:''}{distinctPn.length>1&&distinctCoo.length>1?' · ':''}{distinctCoo.length>1?`${distinctCoo.length} COOs`:''}
                </div>
              )}
            </div>
          </div>
        </div>

        {/* RIGHT — box list + meta + ticket */}
        <div style={{width:380,flexShrink:0,background:C.surface,borderLeft:`1px solid ${C.border}`,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          {/* pallet meta */}
          <div style={{padding:'14px 16px',borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
            <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em',marginBottom:10}}>PALLET / TICKET INFO <span style={{fontWeight:500,letterSpacing:0}}>(optional)</span></div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              <div><label style={labelSx}>PART NUMBER</label><input value={meta.pn} onChange={e=>setMeta(m=>({...m,pn:e.target.value.toUpperCase()}))} placeholder={distinctPn.length===1?distinctPn[0]:'auto / mixed'} style={inputSx}/></div>
              <div><label style={labelSx}>COO</label><input value={meta.coo} onChange={e=>setMeta(m=>({...m,coo:e.target.value.toUpperCase()}))} placeholder={distinctCoo.length===1?distinctCoo[0]:'auto / mixed'} style={inputSx}/></div>
              <div><label style={labelSx}>PO (OPTIONAL)</label><input value={meta.po} onChange={e=>setMeta(m=>({...m,po:e.target.value.toUpperCase()}))} placeholder="VT9A0000…" style={inputSx}/></div>
              <div><label style={labelSx}>REF / DELIVERY</label><input value={meta.ref} onChange={e=>setMeta(m=>({...m,ref:e.target.value.toUpperCase()}))} placeholder="optional" style={inputSx}/></div>
            </div>
          </div>

          {/* box list */}
          <div style={{flex:1,overflowY:'auto',padding:'12px 16px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:'0.08em'}}>BOXES ON PALLET</div>
              <div style={{fontSize:11,color:C.sec}}>{boxes.length} box{boxes.length!==1?'es':''} · {totalPcs} pcs</div>
            </div>
            {boxes.length===0?(
              <div style={{textAlign:'center',padding:'40px 0',color:C.muted}}>
                <Svg name="box" size={34} color={C.border}/>
                <div style={{marginTop:12,fontSize:13}}>No boxes yet</div>
                <div style={{fontSize:11,marginTop:4}}>Scan the first box to begin</div>
              </div>
            ):(
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {boxes.map((b,i)=>(
                  <div key={b.id} style={{display:'flex',alignItems:'center',gap:9,padding:'9px 11px',background:C.s2,border:`1px solid ${C.border}`,borderRadius:8,animation:'slide-in .15s ease'}}>
                    <span style={{fontSize:11,color:C.muted,fontWeight:700,minWidth:42}}>Box {String(i+1).padStart(2,'0')}</span>
                    {editingId===b.id?(
                      <>
                        <input defaultValue={b.qty} autoFocus onKeyDown={e=>{if(e.key==='Enter'){editBox(b.id,{qty:parseInt(e.target.value)||b.qty});setEditingId(null);}}} onBlur={e=>{editBox(b.id,{qty:parseInt(e.target.value)||b.qty});setEditingId(null);}} type="number" min="1" style={{...inputSx,width:70,fontSize:15,fontWeight:800,padding:'5px 8px'}}/>
                        <span style={{fontSize:10,color:C.muted}}>pcs</span>
                      </>
                    ):(
                      <>
                        {b.pn&&<span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:800,color:C.orange,minWidth:60}}>{b.pn}</span>}
                        {b.coo&&<span style={{fontSize:10,color:C.sec}}>{b.coo}</span>}
                        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:17,fontWeight:900,color:C.text,marginLeft:'auto'}}>{b.qty}</span>
                        <span style={{fontSize:9,color:C.muted}}>pcs</span>
                        <button onClick={()=>setEditingId(b.id)} title="Edit qty" style={{background:'none',border:'none',cursor:'pointer',padding:3,display:'flex'}}><Svg name="edit" size={12} color={C.muted}/></button>
                        <button onClick={()=>delBox(b.id)} title="Delete" style={{background:'none',border:'none',cursor:'pointer',padding:3,display:'flex'}}><Svg name="trash" size={12} color={C.muted}/></button>
                      </>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* ticket button */}
          <div style={{padding:'14px 16px',borderTop:`1px solid ${C.border}`,flexShrink:0}}>
            <button disabled={boxes.length===0} onClick={()=>printTicket({
              pn: meta.pn || (distinctPn.length===1?distinctPn[0]:''),
              coo: meta.coo || (distinctCoo.length===1?distinctCoo[0]:''),
              po: meta.po, ref: meta.ref,
            }, boxes)} style={{
              width:'100%',padding:'12px 0',borderRadius:9,border:'none',
              background:boxes.length?C.orange:C.s3,color:boxes.length?'#fff':C.muted,
              cursor:boxes.length?'pointer':'not-allowed',fontSize:14,fontWeight:800,
              display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <Svg name="print" size={16} color={boxes.length?'#fff':C.muted}/>Generate Ticket
            </button>
            <div style={{fontSize:10,color:C.muted,textAlign:'center',marginTop:7}}>Zebra ZT · 12.8 cm wide thermal label with box breakdown</div>
          </div>
        </div>
      </div>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
